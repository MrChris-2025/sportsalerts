<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESPN Alert Hub</title>
  <link rel="manifest" href="/manifest.json">
  <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
  <style>
    :root {
      --bg-dark: #0b0e14;
      --panel-dark: #121824;
      --card-bg: #182030;
      --accent-red: #e51b24;
      --accent-green: #28a745;
      --text-main: #ffffff;
      --text-sub: #8d9bb0;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 200px;
      background-color: var(--panel-dark);
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      overflow-y: auto;
    }
    .brand {
      font-weight: 800;
      font-size: 15px;
      padding: 0 20px 16px;
      letter-spacing: 0.5px;
    }
    .brand span { color: var(--accent-red); }
    .league-btn {
      padding: 10px 20px;
      background: none;
      border: none;
      color: var(--text-sub);
      font-weight: 700;
      text-align: left;
      cursor: pointer;
      font-size: 13px;
    }
    .league-btn.active, .league-btn:hover {
      color: var(--text-main);
      background-color: rgba(229, 27, 36, 0.15);
      border-left: 4px solid var(--accent-red);
    }

    .main-content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .game-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .game-time { font-size: 12px; color: var(--text-sub); margin-bottom: 12px; }
    .team-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .team-info { display: flex; align-items: center; gap: 8px; }
    .team-logo { width: 24px; height: 24px; object-fit: contain; }
    .team-name { font-weight: 700; font-size: 15px; }
    .team-record { font-size: 12px; color: var(--text-sub); }
    .score { font-weight: 800; font-size: 16px; }

    .enable-btn {
      background-color: var(--accent-red);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
      text-transform: uppercase;
    }
    .enable-btn.active { background-color: var(--accent-green); }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="brand"><span>ESPN</span> ALERT HUB</div>
    <button class="league-btn active" onclick="switchLeague('baseball/mlb', this)">MLB</button>
    <button class="league-btn" onclick="switchLeague('basketball/nba', this)">NBA</button>
    <button class="league-btn" onclick="switchLeague('basketball/wnba', this)">WNBA</button>
    <button class="league-btn" onclick="switchLeague('basketball/mens-college-basketball', this)">NCAAM</button>
    <button class="league-btn" onclick="switchLeague('football/nfl', this)">NFL</button>
    <button class="league-btn" onclick="switchLeague('football/college-football', this)">NCAAF</button>
    <button class="league-btn" onclick="switchLeague('hockey/nhl', this)">NHL</button>
    <button class="league-btn" onclick="switchLeague('soccer/eng.1', this)">EPL</button>
    <button class="league-btn" onclick="switchLeague('soccer/usa.1', this)">MLS</button>
    <button class="league-btn" onclick="switchLeague('soccer/uefa.champions', this)">UCL</button>
    <button class="league-btn" onclick="switchLeague('mma/ufc', this)">UFC</button>
    <button class="league-btn" onclick="switchLeague('racing/f1', this)">F1</button>
  </div>

  <div class="main-content">
    <div id="gameGrid" class="grid"></div>
  </div>

  <script>
    const APP_ID = "c8D2QRlTCLFPPfQlHrsQvtEP7AQQMZ9GBrazKLRB";
    const JS_KEY = "M6ztQZxk7rAiUDkQOJ92cpJsQYrdP24e3Q7eyPsG";
    const VAPID_PUBLIC_KEY = "BA8NXZjt4Aj2NsNFZwFQJPvNHoGdz87nVB_0MJCQdbXFMhgOmkWsd-STbCKtgPIBPrWF7-Umqrili8Ef4xS352E";

    Parse.initialize(APP_ID, JS_KEY);
    Parse.serverURL = "https://parseapi.back4app.com/";

    let currentSportPath = 'baseball/mlb';

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    async function loadScoreboard() {
      const grid = document.getElementById('gameGrid');
      grid.innerHTML = '<p style="color:var(--text-sub)">Loading active events...</p>';

      try {
        const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${currentSportPath}/scoreboard`);
        const data = await res.json();
        grid.innerHTML = '';

        if (!data.events || data.events.length === 0) {
          grid.innerHTML = '<p style="color:var(--text-sub)">No scheduled events found today for this sport.</p>';
          return;
        }

        data.events.forEach(event => {
          const comp = event.competitions?.[0];
          if (!comp || !comp.competitors) return;

          const competitors = comp.competitors;
          const home = competitors.find(c => c.homeAway === 'home') || competitors[0];
          const away = competitors.find(c => c.homeAway === 'away') || competitors[1] || competitors[0];

          const awayName = away.team?.abbreviation || away.team?.shortDisplayName || away.athlete?.displayName || 'AWAY';
          const homeName = home.team?.abbreviation || home.team?.shortDisplayName || home.athlete?.displayName || 'HOME';

          const card = document.createElement('div');
          card.className = 'game-card';
          card.innerHTML = `
            <div>
              <div class="game-time">${event.status?.type?.shortDetail || event.date}</div>
              <div class="team-row">
                <div class="team-info">
                  <img class="team-logo" src="${away.team?.logo || away.athlete?.headshot || ''}" alt="">
                  <span class="team-name">${awayName}</span>
                  <span class="team-record">(${away.records?.[0]?.summary || '0-0'})</span>
                </div>
                <div class="score">${away.score ?? 0}</div>
              </div>
              <div class="team-row">
                <div class="team-info">
                  <img class="team-logo" src="${home.team?.logo || home.athlete?.headshot || ''}" alt="">
                  <span class="team-name">${homeName}</span>
                  <span class="team-record">(${home.records?.[0]?.summary || '0-0'})</span>
                </div>
                <div class="score">${home.score ?? 0}</div>
              </div>
            </div>
            <button class="enable-btn" onclick="enableAlerts('${event.id}', this)">Enable Alerts</button>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        grid.innerHTML = '<p style="color:var(--accent-red)">Error loading scoreboard.</p>';
      }
    }

    async function enableAlerts(gameId, btn) {
      btn.innerText = "Connecting...";

      if (APP_ID.includes("YOUR_") || VAPID_PUBLIC_KEY.includes("YOUR_")) {
        alert("Configuration Error: Update APP_ID, JS_KEY, and VAPID_PUBLIC_KEY in index.html.");
        btn.innerText = "Set API Keys";
        return;
      }

      const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
      if (!isStandalone) {
        alert("iPad Requirement: Web Push requires launching from your Home Screen.\n\nTap Share -> 'Add to Home Screen' and open the app from there.");
        btn.innerText = "Add to Home Screen";
        return;
      }

      try {
        const permission = await Notification.requestPermission();
        if (permission !== "granted") {
          btn.innerText = "Permission Denied";
          return;
        }

        const swReg = await navigator.serviceWorker.ready;
        if (!swReg) throw new Error("Service Worker is not ready.");

        const subscription = await swReg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });

        const installationId = await Parse._getInstallationId();

        await Parse.Cloud.run("registerWebPushInstallation", {
          installationId: installationId,
          subscription: JSON.stringify(subscription),
          gameId: String(gameId)
        });

        await Parse.Cloud.run("startGameMonitor", { 
          gameId: String(gameId), 
          sportPath: currentSportPath 
        });

        btn.innerText = "Alerts Enabled";
        btn.classList.add("active");
      } catch (e) {
        console.error("Push activation error:", e);
        btn.innerText = "Error Enabling";
        alert(`Error: ${e.message || e}`);
      }
    }

    function switchLeague(path, btn) {
      currentSportPath = path;
      document.querySelectorAll('.league-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadScoreboard();
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }

    loadScoreboard();
  </script>
</body>
</html>
