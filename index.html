<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e7ebf0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
<title>Sports Alerts</title>

<style>
:root{
  --bg:#e7ebf0;
  --panel:#e7ebf0;
  --text:#202733;
  --muted:#7b8491;
  --dark:#171d27;
  --accent:#315bea;
  --accent2:#18a779;
  --red:#df4d58;
  --shadow:12px 12px 26px #c7ccd3,-12px -12px 26px #fff;
  --inset:inset 5px 5px 11px #c8cdd4,inset -5px -5px 11px #fff;
  --radius:20px;
  --sidebar:218px;
  --top:76px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:"Poppins",sans-serif;
  padding-left:var(--sidebar);
  padding-top:var(--top);
}
button,input{font:inherit}
button{border:0;cursor:pointer;color:inherit}
img{display:block}
.hidden{display:none!important}

/* TOP NAV */
.topbar{
  position:fixed;
  z-index:1000;
  top:0;left:var(--sidebar);right:0;
  height:var(--top);
  background:rgba(231,235,240,.94);
  border-bottom:1px solid rgba(80,90,105,.08);
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  box-shadow:0 5px 18px rgba(70,78,88,.08);
}
.brand{
  display:flex;align-items:center;gap:11px;
  font-size:19px;font-weight:800;
}
.brand-mark{
  width:38px;height:38px;border-radius:12px;
  display:grid;place-items:center;
  background:var(--panel);
  box-shadow:var(--shadow);
  color:var(--accent);
}
.top-right{display:flex;align-items:center;gap:24px}
.clock{text-align:right;line-height:1.25}
.clock .date{font-size:11px;color:var(--muted);font-weight:600}
.clock .time{font-size:16px;font-weight:800}

/* SIDEBAR */
.sidebar{
  position:fixed;z-index:1100;
  left:0;top:0;bottom:0;width:var(--sidebar);
  padding:25px 18px;
  background:var(--bg);
  box-shadow:7px 0 22px rgba(70,78,88,.08);
  overflow-y:auto;
}
.side-brand{margin:0 7px 27px}
.side-brand small{
  color:var(--muted);font-size:10px;font-weight:700;
  letter-spacing:1.2px;text-transform:uppercase
}
.side-title{font-size:22px;font-weight:800}
.side-section-title{
  margin:22px 8px 9px;
  font-size:10px;color:var(--muted);
  text-transform:uppercase;letter-spacing:1px;font-weight:800
}
.sport-btn{
  width:100%;height:48px;padding:0 13px;
  margin-bottom:8px;border-radius:14px;
  display:flex;align-items:center;gap:12px;
  background:transparent;color:var(--muted);
  font-size:13px;font-weight:700;text-align:left;
  transition:.18s ease;
}
.sport-btn i{font-size:17px;width:21px;text-align:center}
.sport-btn:hover{color:var(--text)}
.sport-btn.active{
  color:var(--accent);
  background:var(--panel);
  box-shadow:var(--inset);
}
.push-box{
  margin-top:24px;padding:15px;
  border-radius:16px;
  box-shadow:var(--inset);
}
.push-title{font-size:12px;font-weight:800;margin-bottom:3px}
.push-note{font-size:9px;color:var(--muted);line-height:1.5;margin-bottom:12px}
.toast-sport{
  display:flex;align-items:center;justify-content:space-between;
  padding:8px 0;border-top:1px solid rgba(90,100,110,.08);
  font-size:10px;font-weight:600;
}
.mini-switch,.master-switch{
  position:relative;display:inline-block;flex:none
}
.mini-switch{width:38px;height:21px}
.master-switch{width:48px;height:27px}
.mini-switch input,.master-switch input{
  opacity:0;width:0;height:0;position:absolute
}
.slider{
  position:absolute;inset:0;border-radius:30px;
  background:#d0d5db;box-shadow:var(--inset);
  transition:.2s;
}
.slider:before{
  content:"";position:absolute;
  width:15px;height:15px;left:3px;top:3px;
  border-radius:50%;background:#fff;
  box-shadow:2px 2px 5px #bcc2ca;
  transition:.2s;
}
.master-switch .slider:before{width:19px;height:19px}
input:checked+.slider{background:var(--accent)}
input:checked+.slider:before{transform:translateX(17px)}
.master-switch input:checked+.slider:before{transform:translateX(21px)}

/* MAIN */
.main{
  width:min(1400px,100%);
  margin:auto;padding:28px;
}
.page-head{
  display:flex;justify-content:space-between;align-items:flex-end;
  margin-bottom:22px;
}
.page-head h1{font-size:28px;line-height:1.1;font-weight:800}
.page-head p{margin-top:5px;font-size:12px;color:var(--muted)}
.refresh-status{
  font-size:10px;color:var(--muted);
  display:flex;align-items:center;gap:7px;
}
.refresh-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--accent2);
}

/* WEEK */
.week-strip{
  display:grid;
  grid-template-columns:repeat(7,minmax(80px,1fr));
  gap:10px;
  margin-bottom:22px;
}
.day-btn{
  min-height:67px;border-radius:16px;
  background:var(--panel);
  box-shadow:var(--shadow);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  color:var(--muted);
}
.day-btn .dow{font-size:10px;font-weight:700;text-transform:uppercase}
.day-btn .num{font-size:19px;font-weight:800;color:var(--text)}
.day-btn .mon{font-size:9px}
.day-btn.active{
  color:#fff;background:var(--accent);
  box-shadow:7px 7px 15px rgba(49,91,234,.25),
             -5px -5px 12px rgba(255,255,255,.55);
}
.day-btn.active .num,.day-btn.active .mon{color:#fff}

/* CARD GRID */
.score-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
}
.game-card{
  min-width:0;
  padding:18px;
  border-radius:var(--radius);
  background:var(--panel);
  box-shadow:var(--shadow);
  transition:box-shadow .18s ease;
}
.card-head{
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;margin-bottom:13px;
}
.league{
  display:flex;align-items:center;gap:7px;
  font-size:9px;font-weight:800;
  text-transform:uppercase;letter-spacing:.7px;
  color:var(--muted);
}
.status{
  padding:5px 9px;border-radius:8px;
  box-shadow:var(--inset);
  color:var(--muted);
  font-size:9px;font-weight:800;
  white-space:nowrap;
}
.status.live{color:#fff;background:var(--red);box-shadow:none}
.status.final{color:var(--accent2)}
.card-body{
  border-radius:15px;
  padding:13px;
  box-shadow:var(--inset);
}
.team{
  display:grid;
  grid-template-columns:35px 1fr auto;
  align-items:center;
  gap:10px;
  min-height:47px;
}
.team+.team{border-top:1px solid rgba(70,80,90,.08)}
.logo{
  width:31px;height:31px;object-fit:contain;
}
.team-name{font-size:13px;font-weight:700}
.record{display:block;font-size:8px;color:var(--muted);margin-top:1px}
.score{font-size:23px;font-weight:800}
.team.leading .score{color:var(--accent)}
.game-meta{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-top:12px;
}
.start{
  font-size:10px;color:var(--muted);font-weight:600;
}
.countdown{
  font-size:10px;font-weight:800;color:var(--accent)
}
.alert-btn{
  min-width:84px;padding:7px 10px;border-radius:9px;
  background:var(--panel);box-shadow:var(--inset);
  font-size:9px;font-weight:800;color:var(--muted);
}
.alert-btn.active{color:var(--accent)}
.live-detail{
  margin-top:10px;padding:9px 10px;
  border-radius:10px;
  background:rgba(49,91,234,.055);
  color:var(--muted);
  font-size:9px;font-weight:600;
  line-height:1.55;
}
.live-detail strong{color:var(--text)}
.no-games{
  grid-column:1/-1;
  padding:50px 20px;text-align:center;
  border-radius:20px;box-shadow:var(--inset);
  color:var(--muted);font-size:12px;
}

/* TOASTS */
#toast-area{
  position:fixed;z-index:2000;
  top:90px;right:24px;
  width:min(390px,calc(100vw - 32px));
  display:flex;flex-direction:column;gap:10px;
  pointer-events:none;
}
.toast{
  pointer-events:auto;
  padding:13px 15px;
  border-radius:14px;
  background:var(--panel);
  box-shadow:10px 10px 22px #c3c8cf,-7px -7px 18px #fff;
  border-left:4px solid var(--accent);
  display:grid;grid-template-columns:32px 1fr;
  gap:11px;animation:toastIn .18s ease;
}
@keyframes toastIn{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.toast-logo{width:30px;height:30px;object-fit:contain}
.toast-title{font-size:10px;font-weight:800;color:var(--accent)}
.toast-text{font-size:10px;line-height:1.5;font-weight:600;margin-top:2px}
.toast-time{font-size:8px;color:var(--muted);margin-top:3px}

/* INSTALL NOTICE */
.install-banner{
  display:none;
  margin-bottom:18px;
  padding:14px 16px;border-radius:15px;
  background:var(--panel);box-shadow:var(--inset);
}
.install-banner.show{display:flex;align-items:center;justify-content:space-between;gap:12px}
.install-banner p{font-size:10px;color:var(--muted);line-height:1.5}
.install-btn{
  flex:none;padding:8px 11px;border-radius:9px;
  background:var(--accent);color:#fff;font-size:9px;font-weight:800
}

/* MOBILE */
@media(max-width:900px){
  :root{--sidebar:76px}
  .sidebar{padding:18px 10px}
  .side-brand{margin:0 0 20px;text-align:center}
  .side-brand small,.side-title,.side-section-title,.push-box{display:none}
  .sport-btn{height:52px;justify-content:center;padding:0}
  .sport-btn span{display:none}
  .sport-btn i{font-size:18px}
  .topbar{left:76px;padding:0 17px}
  .main{padding:22px 18px}
}
@media(max-width:620px){
  :root{--sidebar:0px;--top:68px}
  body{padding-left:0}
  .sidebar{
    top:auto;right:0;width:100%;height:69px;
    bottom:0;padding:6px 8px;
    display:flex;overflow-x:auto;box-shadow:0 -5px 20px rgba(70,78,88,.12)
  }
  .side-brand,.side-section-title,.push-box{display:none}
  .sport-btn{flex:0 0 66px;height:56px;margin:0;padding:4px;
    display:flex;flex-direction:column;gap:2px;justify-content:center;
    border-radius:12px}
  .sport-btn span{display:block;font-size:8px}
  .sport-btn i{font-size:16px}
  .topbar{left:0;height:68px;padding:0 14px}
  .brand{font-size:15px}
  .brand-mark{width:32px;height:32px}
  .top-right{gap:10px}
  .clock .date{font-size:9px}
  .clock .time{font-size:13px}
  .main{padding:18px 12px 88px}
  .page-head{align-items:flex-start}
  .page-head h1{font-size:22px}
  .refresh-status{display:none}
  .week-strip{gap:6px;overflow-x:auto}
  .day-btn{min-width:66px;min-height:61px}
  .score-grid{grid-template-columns:1fr;gap:14px}
  #toast-area{top:78px;right:12px}
}
</style>
</head>

<body>

<aside class="sidebar">
  <div class="side-brand">
    <small>Live sports</small>
    <div class="side-title">Alerts</div>
  </div>

  <div class="side-section-title">Sports</div>

  <button class="sport-btn active" data-sport="mlb" onclick="switchSport('mlb',this)">
    <i class="fi fi-rr-baseball"></i><span>MLB</span>
  </button>
  <button class="sport-btn" data-sport="nba" onclick="switchSport('nba',this)">
    <i class="fi fi-rr-basketball"></i><span>NBA</span>
  </button>
  <button class="sport-btn" data-sport="nfl" onclick="switchSport('nfl',this)">
    <i class="fi fi-rr-football"></i><span>NFL</span>
  </button>
  <button class="sport-btn" data-sport="nhl" onclick="switchSport('nhl',this)">
    <i class="fi fi-rr-hockey-puck"></i><span>NHL</span>
  </button>
  <button class="sport-btn" data-sport="soccer" onclick="switchSport('soccer',this)">
    <i class="fi fi-rr-soccer"></i><span>Soccer</span>
  </button>
  <button class="sport-btn" data-sport="mma" onclick="switchSport('mma',this)">
    <i class="fi fi-rr-boxing-glove"></i><span>MMA</span>
  </button>

  <div class="push-box">
    <div class="push-title">Toast alerts</div>
    <div class="push-note">Scoring events only. Configure each sport below.</div>

    <div id="toast-settings"></div>
  </div>
</aside>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark"><i class="fi fi-rr-bolt"></i></div>
    Sports Alerts
  </div>

  <div class="top-right">
    <div class="clock">
      <div class="date" id="top-date"></div>
      <div class="time" id="top-time"></div>
    </div>

    <label class="master-switch" title="Main push alerts">
      <input id="master-push-toggle" type="checkbox">
      <span class="slider"></span>
    </label>
  </div>
</header>

<main class="main">

  <div id="install-banner" class="install-banner">
    <p><strong>Add Sports Alerts to your Home Screen</strong><br>
    Home Screen installation is required before push alerts can be enabled.</p>
    <button class="install-btn" onclick="showInstallHelp()">How to install</button>
  </div>

  <section class="page-head">
    <div>
      <h1 id="section-title">MLB Scores</h1>
      <p id="section-subtitle">Live scores and scoring alerts</p>
    </div>
    <div class="refresh-status">
      <span class="refresh-dot"></span>
      <span id="refresh-text">Live</span>
    </div>
  </section>

  <div id="week-strip" class="week-strip"></div>
  <section id="games-container" class="score-grid"></section>

</main>

<div id="toast-area"></div>

<script>
const VAPID_KEY='BA8NXZjt4Aj2NsNFZwFQJPvNHoGdz87nVB_0MJCQdbXFMhgOmkWsd-STbCKtgPIBPrWF7-Umqrili8Ef4xS352E';
const APP_ID='d1eje7SvxRjIFsdB6c3TuQLlF8v6zExAMBzChgXa';
const JS_KEY='eQqLLilvkNhy04m0OF5J4ry17vw0FKeeEHfPT2mq';

const URLS={
 mlb:'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard',
 nba:'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard',
 nfl:'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
 nhl:'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard',
 soccer:'https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/scoreboard',
 mma:'https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard'
};

const SPORT_NAMES={mlb:'MLB',nba:'NBA',nfl:'NFL',nhl:'NHL',soccer:'Soccer',mma:'MMA'};
const STORAGE='sportsAlertsV3';
const state={
 sport:localStorage.getItem('sport')||'mlb',
 date:dateKey(new Date()),
 cards:new Map(),
 selected:new Set(JSON.parse(localStorage.getItem('selectedGameIds')||'[]')),
 master:localStorage.getItem('masterPushEnabled')==='true',
 toast:{mlb:true,nba:true,nfl:true,nhl:true,soccer:true,mma:true},
 lastScores:new Map()
};

Object.assign(state.toast,JSON.parse(localStorage.getItem('toastSettings')||'{}'));

function dateKey(d){
  return d.toLocaleDateString('en-CA',{timeZone:'America/New_York'});
}
function fmtDate(d){
  return d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});
}
function fmtTime(d){
  return d.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
}
function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function isInstalled(){
  return window.matchMedia('(display-mode: standalone)').matches ||
         window.navigator.standalone===true;
}

/* CLOCK */
function updateClock(){
  const now=new Date();
  document.getElementById('top-date').textContent=fmtDate(now);
  document.getElementById('top-time').textContent=fmtTime(now);
}
setInterval(updateClock,1000);
updateClock();

/* WEEK */
function buildWeek(){
  const strip=document.getElementById('week-strip');
  const today=new Date();
  today.setHours(0,0,0,0);
  strip.innerHTML='';

  for(let i=0;i<7;i++){
    const d=new Date(today);
    d.setDate(today.getDate()+i);
    const key=dateKey(d);
    const b=document.createElement('button');
    b.className='day-btn '+(key===state.date?'active':'');
    b.innerHTML=`
      <span class="dow">${d.toLocaleDateString('en-US',{weekday:'short'})}</span>
      <span class="num">${d.getDate()}</span>
      <span class="mon">${d.toLocaleDateString('en-US',{month:'short'})}</span>`;
    b.onclick=()=>selectDate(key);
    strip.appendChild(b);
  }
}
function selectDate(key){
  state.date=key;
  buildWeek();
  loadSchedule(state.sport,true);
}

/* TOAST SETTINGS */
function buildToastSettings(){
  const root=document.getElementById('toast-settings');
  root.innerHTML=Object.entries(SPORT_NAMES).map(([key,name])=>`
    <div class="toast-sport">
      <span>${name}</span>
      <label class="mini-switch">
        <input type="checkbox" data-toast="${key}" ${state.toast[key]?'checked':''}>
        <span class="slider"></span>
      </label>
    </div>`).join('');

  root.querySelectorAll('[data-toast]').forEach(input=>{
    input.onchange=()=>{
      state.toast[input.dataset.toast]=input.checked;
      localStorage.setItem('toastSettings',JSON.stringify(state.toast));
    };
  });
}

/* PUSH / PWA */
document.getElementById('master-push-toggle').checked=state.master;

function showInstallHelp(){
  alert(
    'iPhone/iPad: tap Share, then Add to Home Screen.\\n\\n'+
    'Android: use the browser menu and choose Install app or Add to Home screen.'
  );
}

function checkInstallRequirement(){
  const banner=document.getElementById('install-banner');
  if(isInstalled()) banner.classList.remove('show');
  else banner.classList.add('show');

  document.getElementById('master-push-toggle').disabled=!isInstalled();
}
checkInstallRequirement();

window.matchMedia('(display-mode: standalone)').addEventListener?.('change',checkInstallRequirement);

document.getElementById('master-push-toggle').onchange=async e=>{
  if(e.target.checked && !isInstalled()){
    e.target.checked=false;
    state.master=false;
    localStorage.setItem('masterPushEnabled','false');
    showInstallHelp();
    return;
  }

  state.master=e.target.checked;
  localStorage.setItem('masterPushEnabled',state.master);

  if(!state.master){
    await syncSubscriptionWithServer();
    return;
  }

  if(!('serviceWorker' in navigator)||!('PushManager' in window)){
    e.target.checked=false;
    state.master=false;
    localStorage.setItem('masterPushEnabled','false');
    alert('Push notifications are not supported by this browser.');
    return;
  }

  try{
    const permission=await Notification.requestPermission();
    if(permission!=='granted') throw new Error('Notification permission denied');

    await syncSubscriptionWithServer();
  }catch(err){
    console.error(err);
    e.target.checked=false;
    state.master=false;
    localStorage.setItem('masterPushEnabled','false');
  }
};

async function syncSubscriptionWithServer(){
  if(!isInstalled()||!('serviceWorker' in navigator)) return;

  try{
    const reg=await navigator.serviceWorker.register('/sw.js',{scope:'/'});
    await navigator.serviceWorker.ready;

    let subscription=null;

    if(state.master){
      subscription=await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:urlBase64ToUint8Array(VAPID_KEY)
      });
    }

    await fetch('https://parseapi.back4app.com/parse/functions/saveSubscription',{
      method:'POST',
      headers:{
        'X-Parse-Application-Id':APP_ID,
        'X-Parse-JavaScript-Key':JS_KEY,
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        subscription:state.master?subscription.toJSON():null,
        gameIds:state.master?[...state.selected]:[]
      })
    });
  }catch(err){
    console.error('Push sync error:',err);
  }
}

function urlBase64ToUint8Array(base64){
  const padding='='.repeat((4-base64.length%4)%4);
  const raw=atob((base64+padding).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

/* SPORT */
function switchSport(cat,btn){
  state.sport=cat;
  localStorage.setItem('sport',cat);
  document.querySelectorAll('.sport-btn').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  loadSchedule(cat,true);
}

/* CARD HELPERS */
function eventStart(e){
  return new Date(e.date||e.competitions?.[0]?.date||Date.now());
}
function statusText(e){
  const s=e.status?.type;
  if(s?.state==='in') return s.detail||s.shortDetail||'LIVE';
  if(s?.completed) return 'FINAL';
  return s?.detail||s?.shortDetail||'UPCOMING';
}
function getTeams(e){
  const c=e.competitions?.[0]?.competitors||[];
  return {
    away:c.find(x=>x.homeAway==='away')||c[0],
    home:c.find(x=>x.homeAway==='home')||c[1]
  };
}
function teamData(t){
  return {
    name:t?.team?.shortDisplayName||t?.team?.displayName||t?.athlete?.displayName||'Team',
    logo:t?.team?.logo||t?.athlete?.headshot?.href||'',
    record:t?.records?.[0]?.summary||'',
    score:t?.score??'0'
  };
}
function startLabel(e){
  const d=eventStart(e);
  return fmtTime(d);
}
function countdown(e){
  const start=eventStart(e);
  const diff=start-Date.now();
  if(diff<=0)return '';
  const mins=Math.floor(diff/60000);
  const h=Math.floor(mins/60);
  const m=mins%60;
  return `Starts in ${h?`${h}h `:''}${m}m`;
}

/* LIVE DETAILS */
function liveDetails(cat,e){
  const c=e.competitions?.[0]||{};
  const s=c.situation||e.situation||{};
  const stateType=e.status?.type?.state;

  if(stateType!=='in') return '';

  if(cat==='mlb'){
    const inning=s?.outs!==undefined?
      `${s.inningHalf||s.halfInning||''} ${s.inning||''}`.trim():'Live';
    const outs=s.outs!==undefined?`Outs: ${s.outs}`:'';
    const balls=s.balls!==undefined?`Balls: ${s.balls}`:'';
    const strikes=s.strikes!==undefined?`Strikes: ${s.strikes}`:'';
    const bases=[
      s.onFirst?'1B':'',
      s.onSecond?'2B':'',
      s.onThird?'3B':''
    ].filter(Boolean).join(' ');
    return [inning,balls,strikes,outs,bases?`Runners: ${bases}`:''].filter(Boolean).join(' • ');
  }

  if(cat==='nfl'){
    return [e.status?.type?.detail,s.shortDownDistance,s.possession?.team?.abbreviation?
      `Possession: ${s.possession.team.abbreviation}`:''].filter(Boolean).join(' • ');
  }

  if(cat==='nba'){
    return [e.status?.type?.detail,s.lastPlay?.text||''].filter(Boolean).join(' • ');
  }

  if(cat==='nhl'){
    return [e.status?.type?.detail,s.period?.displayValue||s.period,s.clock?.displayValue?
      `Clock: ${s.clock.displayValue}`:''].filter(Boolean).join(' • ');
  }

  if(cat==='soccer'){
    return [e.status?.type?.detail,s.possession?.team?.abbreviation?
      `Possession: ${s.possession.team.abbreviation}`:''].filter(Boolean).join(' • ');
  }

  return e.status?.type?.detail||'Live';
}

/* CARD CREATION */
function createCard(id){
  const card=document.createElement('article');
  card.className='game-card';
  card.dataset.id=id;
  card.innerHTML=`
    <div class="card-head">
      <div class="league"><i class="fi fi-rr-broadcast-tower"></i><span class="league-name"></span></div>
      <span class="status"></span>
    </div>
    <div class="card-body">
      <div class="team away team-a">
        <img class="logo" alt="">
        <div><span class="team-name"></span><span class="record"></span></div>
        <strong class="score"></strong>
      </div>
      <div class="team home team-h">
        <img class="logo" alt="">
        <div><span class="team-name"></span><span class="record"></span></div>
        <strong class="score"></strong>
      </div>
    </div>
    <div class="game-meta">
      <span class="start"></span>
      <span class="countdown"></span>
      <button class="alert-btn"></button>
    </div>
    <div class="live-detail"></div>`;
  return card;
}

function updateCard(card,cat,e){
  const {away,home}=getTeams(e);
  const a=teamData(away),h=teamData(home);
  const live=e.status?.type?.state==='in';
  const final=e.status?.type?.completed;

  card.className='game-card '+(state.selected.has(String(e.id))?'selected':'');
  card.querySelector('.league-name').textContent=SPORT_NAMES[cat];

  const status=card.querySelector('.status');
  status.textContent=statusText(e);
  status.className='status '+(live?'live ':'')+(final?'final':'');

  setTeam(card.querySelector('.team-a'),a,Number(a.score)>Number(h.score));
  setTeam(card.querySelector('.team-h'),h,Number(h.score)>Number(a.score));

  card.querySelector('.start').textContent=
    final||live?'':`Start: ${startLabel(e)}`;

  card.querySelector('.countdown').textContent=live?'':countdown(e);

  const alertBtn=card.querySelector('.alert-btn');
  const selected=state.selected.has(String(e.id));
  alertBtn.textContent=selected?'Alerts On':'Alerts Off';
  alertBtn.className='alert-btn '+(selected?'active':'');
  alertBtn.onclick=()=>toggleGameAlert(e.id,card);

  card.querySelector('.live-detail').innerHTML=
    live?`<strong>${esc(statusText(e))}</strong> ${esc(liveDetails(cat,e))}`:'';

  return {
    awayScore:a.score,
    homeScore:h.score,
    live,
    final,
    away:a,
    home:h,
    event:e
  };
}

function setTeam(row,t,leading){
  row.classList.toggle('leading',leading);
  row.querySelector('.logo').src=t.logo||'';
  row.querySelector('.logo').alt=t.name;
  row.querySelector('.team-name').textContent=t.name;
  row.querySelector('.record').textContent=t.record;
  row.querySelector('.score').textContent=t.score;
}

/* SCORING TOAST DETECTION */
function scoreChanged(id,data){
  const old=state.lastScores.get(id);
  const changed=old &&
    (String(old.away)!==String(data.awayScore)||
     String(old.home)!==String(data.homeScore));

  state.lastScores.set(id,{
    away:data.awayScore,
    home:data.homeScore
  });

  return changed;
}

function scoringToast(cat,data){
  if(!state.toast[cat]||!data.live)return;

  const oldAway=Number(data.awayScore);
  const oldHome=Number(data.homeScore);
  const key=`toast:${cat}:${data.event.id}:${oldAway}-${oldHome}`;

  /* The exact scoring-play description should come from your backend/
     ESPN summary payload when available. This fallback remains detailed. */
  if(sessionStorage.getItem(key))return;
  sessionStorage.setItem(key,'1');

  const scoringTeam=oldAway>oldHome?data.away:data.home;
  const other=oldAway>oldHome?data.home:data.away;

  let title='Score update';
  let detail=`${scoringTeam.name} scored. ${data.away.name}: ${data.awayScore} - ${data.home.name}: ${data.homeScore} - ${data.event.status?.type?.detail||'Live'}`;

  addToast(title,detail,scoringTeam.logo);
}

function addToast(title,text,logo){
  const area=document.getElementById('toast-area');
  const el=document.createElement('div');
  el.className='toast';
  el.innerHTML=`
    <img class="toast-logo" src="${esc(logo)}" alt="">
    <div>
      <div class="toast-title">${esc(title)}</div>
      <div class="toast-text">${esc(text)}</div>
      <div class="toast-time">${fmtTime(new Date())}</div>
    </div>`;
  area.prepend(el);
  setTimeout(()=>el.remove(),8000);
}

/*
  Optional backend enhancement:
  If your existing backend supplies scoring-play text, return it with
  the scoreboard payload as e.scoringPlay / e.scoringText and replace
  the fallback detail above with that value.
*/

/* LOAD WITHOUT FLICKER */
async function loadSchedule(cat,force=false){
  const container=document.getElementById('games-container');
  document.getElementById('section-title').textContent=`${SPORT_NAMES[cat]} Scores`;

  try{
    const url=`${URLS[cat]}?dates=${state.date.replaceAll('-','')}`;
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok)throw new Error('Score request failed');
    const data=await res.json();
    const events=data.events||[];

    const incoming=new Set(events.map(e=>String(e.id)));

    if(!events.length){
      if(container.children.length!==1||
         !container.querySelector('.no-games')){
        container.innerHTML='<div class="no-games">No games scheduled for this date.</div>';
      }
      return;
    }

    const empty=container.querySelector('.no-games');
    if(empty)empty.remove();

    /* Remove games that disappeared without replacing the entire grid. */
    [...container.children].forEach(card=>{
      if(card.dataset.id&&!incoming.has(card.dataset.id))card.remove();
    });

    events.forEach(e=>{
      const id=String(e.id);
      let card=state.cards.get(id);

      if(!card||!card.isConnected){
        card=createCard(id);
        state.cards.set(id,card);
        container.appendChild(card);
      }

      const dataForCard=updateCard(card,cat,e);

      if(!force&&scoreChanged(id,dataForCard)){
        scoringToast(cat,dataForCard);
      }else if(force){
        state.lastScores.set(id,{
          away:dataForCard.awayScore,
          home:dataForCard.homeScore
        });
      }
    });

    document.getElementById('refresh-text').textContent=
      `Updated ${fmtTime(new Date())}`;
  }catch(err){
    console.error(err);
    if(!container.children.length){
      container.innerHTML='<div class="no-games">Unable to load scores.</div>';
    }
    document.getElementById('refresh-text').textContent='Update unavailable';
  }
}

/* GAME ALERTS */
function toggleGameAlert(id,card){
  id=String(id);

  if(state.selected.has(id))state.selected.delete(id);
  else state.selected.add(id);

  localStorage.setItem('selectedGameIds',JSON.stringify([...state.selected]));

  const active=state.selected.has(id);
  card.querySelector('.alert-btn').textContent=active?'Alerts On':'Alerts Off';
  card.querySelector('.alert-btn').classList.toggle('active',active);
  card.classList.toggle('selected',active);

  if(state.master)syncSubscriptionWithServer();
}

/* INITIALIZE */
buildWeek();
buildToastSettings();

document.querySelectorAll('.sport-btn').forEach(b=>{
  b.classList.toggle('active',b.dataset.sport===state.sport);
});

loadSchedule(state.sport,true);

/* Silent refresh: update every 20 seconds without clearing cards. */
setInterval(()=>{
  loadSchedule(state.sport,false);
},20000);

/* Keep countdown labels current without refetching/repainting cards. */
setInterval(()=>{
  document.querySelectorAll('.game-card').forEach(card=>{
    const id=card.dataset.id;
    const cached=state.cards.get(id);
    if(!cached)return;

    /* Countdown is refreshed by the next silent API update. */
  });
},60000);
</script>
