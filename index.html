<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESPN Score Alerts</title>
</head>
<body style="font-family: system-ui; text-align: center; padding: 3rem 1rem;">
  <h2>Live Sports Push Alerts</h2>
  <button id="enable-btn" style="padding: 16px 32px; font-size: 18px; border-radius: 8px; background: #007aff; color: white; border: none;">Enable Score Notifications</button>

  <script>
    const VAPID_PUBLIC_KEY = 'BA8NXZjt4Aj2NsNFZwFQJPvNHoGdz87nVB_0MJCQdbXFMhgOmkWsd-STbCKtgPIBPrWF7-Umqrili8Ef4xS352E';
    const PARSE_APP_ID = 'd1eje7SvxRjIFsdB6c3TuQLlF8v6zExAMBzChgXa';
    const PARSE_JS_KEY = 'eQqLLilvkNhy04m0OF5J4ry17vw0FKeeEHfPT2mq';

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    document.getElementById('enable-btn').addEventListener('click', async () => {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        alert('Push notifications require installing this page to your Home Screen first!');
        return;
      }

      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        alert('Notification permission was denied in iPad settings.');
        return;
      }

      const reg = await navigator.serviceWorker.register('./sw.js');
      const subscription = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });

      await fetch('https://parseapi.back4app.com/functions/saveSubscription', {
        method: 'POST',
        headers: {
          'X-Parse-Application-Id': PARSE_APP_ID,
          'X-Parse-JavaScript-Key': PARSE_JS_KEY,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({ subscription: subscription.toJSON() })
      });

      alert('SUCCESS! Your iPad is registered to receive score alerts.');
    });
  </script>
</body>
</html>
