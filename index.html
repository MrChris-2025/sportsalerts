<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Sports Tracker</title>
  <link rel="manifest" href="./manifest.json">
  <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #fff; font-family: system-ui, sans-serif; padding: 16px; margin: 0; }
    .card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 16px; margin-bottom: 12px; backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
    .header { display: flex; justify-content: space-between; align-items: center; }
    
    .controls { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
    select, input[type="date"] { background: #1e293b; color: white; border: 1px solid #334155; padding: 10px 14px; border-radius: 8px; font-size: 14px; outline: none; }
    
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #3b82f6; }
    input:checked + .slider:before { transform: translateX(20px); }

    .game-meta { font-size: 12px; color: #94a3b8; font-weight: 600; text-transform: uppercase; margin-bottom: 8px; }
    .teams-row { display: flex; flex-direction: column; gap: 6px; font-size: 16px; }
    .team { display: flex; justify-content: space-between; }
  </style>
</head>
<body>
  <div class="card header">
    <div>
      <h2 style="margin:0; font-size: 18px;">Main Push Alerts</h2>
      <span style="font-size: 12px; color: #94a3b8;">Enable background notifications</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="main-push-toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="controls">
    <select id="league-select">
      <option value="basketball/nba">NBA Basketball</option>
      <option value="football/nfl">NFL Football</option>
      <option value="baseball/mlb">MLB Baseball</option>
      <option value="hockey/nhl">NHL Hockey</option>
      <option value="soccer/eng.1">English Premier League</option>
      <option value="football/mens-college-football">NCAA College Football</option>
      <option value="basketball/mens-college-basketball">NCAA College Basketball</option>
    </select>
    <input type="date" id="date-picker">
  </div>

  <div id="games-container">Loading schedule...</div>

  <script type="module" src="./index.js"></script>
</body>
</html>
