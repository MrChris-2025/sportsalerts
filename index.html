<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ESPN Live Games & Alerts</title>

  <!-- PWA & Apple iOS Metadata -->
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ESPN Alerts">
  <link rel="apple-touch-icon" href="https://a.espncdn.com/i/espn/espn_logos/espn_red.png">
  <meta name="theme-color" content="#007aff">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      max-width: 480px;
      margin: 0 auto;
      padding: 2rem 1rem;
      background-color: #f4f4f9;
      color: #1c1c1e;
    }
    h2 { text-align: center; margin: 0 0 0.5rem 0; font-size: 24px; font-weight: 700; }
    p.subtitle { text-align: center; color: #6c6c70; font-size: 14px; margin: 0 0 2rem 0; }
    .game-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 1.2rem 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .game-info { font-weight: 600; font-size: 16px; margin-bottom: 4px; }
    .game-status { font-size: 13px; color: #8e8e93; }
    input[type="checkbox"] {
      width: 24px;
      height: 24px;
      accent-color: #007aff;
      border-radius: 6px;
      cursor: pointer;
    }
    button {
      width: 100%;
      background-color: #007aff;
      color: white;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 1.5rem;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
    }
    button:active { opacity: 0.85; transform: scale(0.99); }
  </style>
</head>
<body>

  <h2>Scheduled ESPN Games</h2>
  <p class="subtitle">Select matches to receive live push alerts on your iPad</p>

  <div id="games-container">Loading ESPN schedule...</div>

  <button id="subscribe-btn">Save Preferences & Enable Push</button>

  <script>
    const VAPID_PUBLIC_KEY = 'BA8NXZjt4Aj2NsNFZwFQJPvNHoGdz87nVB_0MJCQdbXFMhgOmkWsd-STbCKtgPIBPrWF7-Umqrili8Ef4xS352E';
    const PARSE_APP_ID = 'd1eje7SvxRjIFsdB6c3TuQLlF8v6zExAMBzChgXa';
    const PARSE_JS_KEY = 'eQqLLilvkNhy04m0OF5J4ry17vw0FKeeEHfPT2mq';

    async function loadSchedule() {
      const container = document.getElementById('games-container');
      try {
        const res = await fetch('https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard');
        const data = await res.json();
        
        if (!data.events || data.events.length === 0) {
          container.innerHTML = '<p style="text-align:center; color: #8e8e93;">No games scheduled today.</p>';
          return;
        }

        container.innerHTML = '';
        data.events.forEach(event => {
          const comp = event.competitions[0];
          const home = comp.competitors.find(c => c.homeAway === 'home').team.displayName;
          const away = comp.competitors.find(c => c.homeAway === 'away').team.displayName;
          const status = event.status.type.detail;

          const card = document.createElement('div');
          card.className = 'game-card';
          card.innerHTML = `
            <div>
              <div class="game-info">${away} @ ${home}</div>
              <div class="game-status">${status}</div>
            </div>
            <input type="checkbox" class="game-checkbox" value="${event.id}">
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = '<p style="text-align:center; color:#ff3b30;">Failed to load ESPN schedule.</p>';
      }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    document.getElementById('subscribe-btn').addEventListener('click', async () => {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        alert('Please launch this app from your iPad Home Screen to enable push alerts.');
        return;
      }

      const selectedGames = Array.from(document.querySelectorAll('.game-checkbox:checked')).map(cb => cb.value);

      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        alert('Notification permission was denied in settings.');
        return;
      }

      try {
        const reg = await navigator.serviceWorker.register('./sw.js');
        const subscription = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });

        const res = await fetch('https://parseapi.back4app.com/functions/saveSubscription', {
          method: 'POST',
          headers: {
            'X-Parse-Application-Id': PARSE_APP_ID,
            'X-Parse-JavaScript-Key': PARSE_JS_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ 
            subscription: subscription.toJSON(),
            gameIds: selectedGames 
          })
        });

        if (res.ok) {
          alert('Success! iPad registered for push notifications.');
        } else {
          alert('Failed to save subscription to Back4App.');
        }
      } catch (err) {
        alert('Error enabling notifications: ' + err.message);
      }
    });

    loadSchedule();
  </script>
</body>
</html>
