<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESPN Alert Hub</title>
  <link rel="manifest" href="/manifest.json">
  <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
  <style>
    :root {
      --bg-dark: #0b0e14;
      --panel-dark: #121824;
      --card-bg: #182030;
      --accent-red: #e51b24;
      --accent-green: #28a745;
      --text-main: #ffffff;
      --text-sub: #8d9bb0;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      width: 180px;
      background-color: var(--panel-dark);
      padding: 20px 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }
    .brand {
      font-weight: 800;
      font-size: 15px;
      padding: 0 20px 20px;
      letter-spacing: 0.5px;
    }
    .brand span { color: var(--accent-red); }
    .league-btn {
      padding: 12px 20px;
      background: none;
      border: none;
      color: var(--text-sub);
      font-weight: 700;
      text-align: left;
      cursor: pointer;
    }
    .league-btn.active, .league-btn:hover {
      color: var(--text-main);
      background-color: rgba(229, 27, 36, 0.15);
      border-left: 4px solid var(--accent-red);
    }

    .main-content {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .game-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    .game-time { font-size: 12px; color: var(--text-sub); margin-bottom: 12px; }
    .team-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .team-info { display: flex; align-items: center; gap: 8px; }
    .team-logo { width: 24px; height: 24px; }
    .team-name { font-weight: 700; font-size: 15px; }
    .team-record { font-size: 12px; color: var(--text-sub); }
    .score { font-weight: 800; font-size: 16px; }

    .enable-btn {
      background-color: var(--accent-red);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
      width: 100%;
      text-transform: uppercase;
    }
    .enable-btn.active { background-color: var(--accent-green); }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="brand"><span>ESPN</span> ALERT HUB</div>
    <button class="league-btn active" onclick="switchLeague('mlb', 'baseball/mlb', this)">MLB</button>
    <button class="league-btn" onclick="switchLeague('nba', 'basketball/nba', this)">NBA</button>
    <button class="league-btn" onclick="switchLeague('nfl', 'football/nfl', this)">NFL</button>
    <button class="league-btn" onclick="switchLeague('nhl', 'hockey/nhl', this)">NHL</button>
    <button class="league-btn" onclick="switchLeague('epl', 'soccer/eng.1', this)">EPL</button>
  </div>

  <div class="main-content">
    <div id="gameGrid" class="grid"></div>
  </div>

  <script>
    Parse.initialize("c8D2QRlTCLFPPfQlHrsQvtEP7AQQMZ9GBrazKLRB", "M6ztQZxk7rAiUDkQOJ92cpJsQYrdP24e3Q7eyPsG");
    Parse.serverURL = "https://parseapi.back4app.com/";

    let currentSportPath = 'baseball/mlb';

    async function loadScoreboard() {
      const grid = document.getElementById('gameGrid');
      grid.innerHTML = '<p style="color:var(--text-sub)">Loading active games...</p>';

      try {
        const res = await fetch(`https://site.api.espn.com/apis/site/v2/sports/${currentSportPath}/scoreboard`);
        const data = await res.json();
        grid.innerHTML = '';

        if (!data.events || data.events.length === 0) {
          grid.innerHTML = '<p style="color:var(--text-sub)">No games scheduled today.</p>';
          return;
        }

        data.events.forEach(event => {
          const comp = event.competitions[0];
          const home = comp.competitors.find(c => c.homeAway === 'home');
          const away = comp.competitors.find(c => c.homeAway === 'away');

          const card = document.createElement('div');
          card.className = 'game-card';
          card.innerHTML = `
            <div>
              <div class="game-time">${event.status.type.shortDetail || event.date}</div>
              <div class="team-row">
                <div class="team-info">
                  <img class="team-logo" src="${away.team.logo || ''}" alt="">
                  <span class="team-name">${away.team.abbreviation}</span>
                  <span class="team-record">(${away.records?.[0]?.summary || '0-0'})</span>
                </div>
                <div class="score">${away.score || 0}</div>
              </div>
              <div class="team-row">
                <div class="team-info">
                  <img class="team-logo" src="${home.team.logo || ''}" alt="">
                  <span class="team-name">${home.team.abbreviation}</span>
                  <span class="team-record">(${home.records?.[0]?.summary || '0-0'})</span>
                </div>
                <div class="score">${home.score || 0}</div>
              </div>
            </div>
            <button class="enable-btn" onclick="enableAlerts('${event.id}', this)">Enable Alerts</button>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        grid.innerHTML = '<p style="color:var(--accent-red)">Error loading scoreboard.</p>';
      }
    }

    async function enableAlerts(gameId, btn) {
      btn.innerText = "Connecting...";
      try {
        if ("Notification" in window && Notification.permission !== "granted") {
          await Notification.requestPermission();
        }

        const installationId = await Parse._getInstallationId();
        const Installation = Parse.Object.extend("_Installation");
        const query = new Parse.Query(Installation);
        query.equalTo("installationId", installationId);
        
        let installObj = await query.first();
        if (!installObj) {
          installObj = new Installation();
          installObj.set("installationId", installationId);
          installObj.set("deviceType", "web");
        }
        
        installObj.addUnique("channels", `game_${gameId}`);
        await installObj.save();

        await Parse.Cloud.run("startGameMonitor", { gameId, sportPath: currentSportPath });

        btn.innerText = "Alerts Enabled";
        btn.classList.add("active");
      } catch (e) {
        btn.innerText = "Error Enabling";
      }
    }

    function switchLeague(league, path, btn) {
      currentSportPath = path;
      document.querySelectorAll('.league-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadScoreboard();
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js'));
    }

    loadScoreboard();
  </script>
</body>
</html>
