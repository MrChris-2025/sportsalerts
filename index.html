<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#e7ebf2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="light">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/3.0.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Sports Alerts</title>

<style>
:root{
  --bg:#e7ebf2;
  --panel:#e7ebf2;
  --text:#202735;
  --muted:#778091;
  --accent:#4056d6;
  --accent-dark:#3044b4;
  --green:#198754;
  --red:#c84a57;
  --line:rgba(91,104,128,.16);
  --shadow-out:9px 9px 18px #c7ccd5,-9px -9px 18px #fff;
  --shadow-soft:5px 5px 12px #cbd0d8,-5px -5px 12px #fff;
  --shadow-in:inset 4px 4px 9px #c8cdd5,inset -4px -4px 9px #fff;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  min-height:100vh;
  background:var(--bg);
  color:var(--text);
  font-family:Poppins,sans-serif;
  font-size:14px;
}
button,input{font:inherit}
button{color:inherit}
.app-shell{min-height:100vh}
.sidebar{
  position:fixed;
  left:0;top:0;bottom:0;
  width:225px;
  padding:22px 16px;
  background:var(--panel);
  box-shadow:8px 0 22px rgba(67,77,95,.10);
  z-index:1000;
  overflow-y:auto;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  margin:0 8px 25px;
  font-weight:800;
  font-size:18px;
}
.brand i{font-size:22px;color:var(--accent)}
.sidebar-heading{
  margin:18px 8px 9px;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:1px;
}
.sport-list{display:grid;gap:7px}
.sport-btn{
  width:100%;
  border:0;
  background:transparent;
  border-radius:13px;
  padding:11px 12px;
  display:flex;
  align-items:center;
  gap:11px;
  cursor:pointer;
  color:var(--muted);
  font-weight:600;
  text-align:left;
}
.sport-btn i{font-size:16px;width:20px;text-align:center}
.sport-btn.active{
  color:var(--accent);
  box-shadow:var(--shadow-in);
}
.toast-settings{display:grid;gap:7px}
.toast-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:9px 8px;
  border-radius:12px;
}
.toast-row span{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:11px;
  font-weight:600;
}
.toggle{
  position:relative;
  width:38px;
  height:21px;
  flex:none;
}
.toggle input{display:none}
.toggle-slider{
  position:absolute;
  inset:0;
  border-radius:20px;
  background:#cbd0d8;
  box-shadow:var(--shadow-in);
  cursor:pointer;
}
.toggle-slider:before{
  content:"";
  position:absolute;
  width:15px;height:15px;
  left:3px;top:3px;
  border-radius:50%;
  background:#fff;
  box-shadow:2px 2px 4px rgba(0,0,0,.18);
  transition:.2s ease;
}
.toggle input:checked+.toggle-slider{background:var(--accent)}
.toggle input:checked+.toggle-slider:before{transform:translateX(17px)}
.main{
  margin-left:225px;
  min-width:0;
}
.topbar{
  position:sticky;
  top:0;
  z-index:900;
  height:72px;
  padding:12px 28px;
  background:rgba(231,235,242,.94);
  backdrop-filter:blur(12px);
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
}
.top-left h1{font-size:18px;font-weight:800}
.top-left p{font-size:11px;color:var(--muted);margin-top:1px}
.top-right{display:flex;align-items:center;gap:14px}
.clock{
  text-align:right;
  font-size:12px;
  font-weight:700;
  line-height:1.25;
}
.clock small{display:block;color:var(--muted);font-weight:500}
.push-box{
  display:flex;
  align-items:center;
  gap:9px;
  padding:7px 10px;
  border-radius:12px;
  box-shadow:var(--shadow-soft);
}
.push-label{font-size:10px;font-weight:800;letter-spacing:.5px}
.push-state{font-size:9px;color:var(--muted)}
.content{padding:24px 28px 50px}
.date-strip{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding:6px 3px 16px;
  scrollbar-width:none;
}
.date-strip::-webkit-scrollbar{display:none}
.date-btn{
  min-width:82px;
  border:0;
  border-radius:15px;
  padding:10px 8px;
  background:var(--panel);
  box-shadow:var(--shadow-soft);
  cursor:pointer;
}
.date-btn .day{
  display:block;
  color:var(--muted);
  font-size:9px;
  font-weight:700;
  text-transform:uppercase;
}
.date-btn strong{
  display:block;
  font-size:17px;
  margin:1px 0;
}
.date-btn .month{
  display:block;
  color:var(--muted);
  font-size:9px;
}
.date-btn.active{
  background:var(--accent);
  color:#fff;
  box-shadow:inset 2px 2px 4px rgba(0,0,0,.14),4px 4px 10px #c3c8d1;
}
.date-btn.active .day,.date-btn.active .month{color:rgba(255,255,255,.78)}
.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:2px 2px 14px;
}
.section-head h2{font-size:16px;font-weight:800}
.section-head span{font-size:10px;color:var(--muted)}
.games-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:16px;
}
.game-card{
  min-width:0;
  padding:17px;
  border-radius:19px;
  background:var(--panel);
  box-shadow:var(--shadow-out);
  border:1px solid rgba(255,255,255,.45);
}
.game-card.live{box-shadow:var(--shadow-out),0 0 0 1px rgba(64,86,214,.16)}
.card-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:13px;
}
.status{
  color:var(--muted);
  font-size:9px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.5px;
}
.status.live{color:var(--green)}
.alert-btn{
  border:0;
  border-radius:10px;
  background:var(--panel);
  box-shadow:var(--shadow-soft);
  padding:7px 9px;
  color:var(--muted);
  cursor:pointer;
  font-size:10px;
  font-weight:700;
}
.alert-btn.active{color:var(--accent);box-shadow:var(--shadow-in)}
.teams{display:grid;gap:10px}
.team{
  display:grid;
  grid-template-columns:34px minmax(0,1fr) auto;
  align-items:center;
  gap:10px;
}
.team-logo{
  width:30px;height:30px;
  object-fit:contain;
}
.team-name{
  font-size:13px;
  font-weight:700;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.team-record{display:block;color:var(--muted);font-size:9px}
.score{font-size:21px;font-weight:800}
.game-meta{
  margin-top:13px;
  padding-top:11px;
  border-top:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  gap:8px;
  color:var(--muted);
  font-size:10px;
  font-weight:600;
}
.situation{
  margin-top:8px;
  padding:10px;
  border-radius:11px;
  box-shadow:var(--shadow-in);
  color:var(--muted);
  font-size:10px;
  line-height:1.5;
}
.situation strong{color:var(--text)}
.countdown{color:var(--accent)}
.empty,.error{
  grid-column:1/-1;
  padding:45px 20px;
  text-align:center;
  color:var(--muted);
}
.error{color:var(--red)}
.toast-stack{
  position:fixed;
  right:20px;
  top:84px;
  width:min(390px,calc(100vw - 30px));
  z-index:2000;
  display:grid;
  gap:10px;
  pointer-events:none;
}
.toast{
  display:grid;
  grid-template-columns:34px 1fr;
  gap:10px;
  padding:12px;
  border-radius:15px;
  background:var(--panel);
  box-shadow:var(--shadow-out);
  animation:toastIn .22s ease;
}
.toast-logo{width:30px;height:30px;object-fit:contain}
.toast-title{font-size:10px;color:var(--accent);font-weight:800;text-transform:uppercase}
.toast-text{font-size:11px;line-height:1.45;font-weight:600}
.toast-score{font-size:10px;color:var(--muted);margin-top:2px}
@keyframes toastIn{
  from{opacity:0;transform:translateY(-8px)}
  to{opacity:1;transform:translateY(0)}
}
.install-note{
  margin-top:15px;
  padding:10px;
  border-radius:12px;
  box-shadow:var(--shadow-in);
  color:var(--muted);
  font-size:9px;
  line-height:1.45;
}
.hidden{display:none!important}

@media(max-width:900px){
  .sidebar{width:190px}
  .main{margin-left:190px}
  .content{padding:20px}
  .topbar{padding:12px 20px}
}
@media(max-width:680px){
  .sidebar{
    position:sticky;
    top:0;
    width:100%;
    height:auto;
    max-height:none;
    padding:10px 12px;
    z-index:1100;
    box-shadow:0 5px 15px rgba(67,77,95,.12);
  }
  .brand{display:none}
  .sidebar-heading{display:none}
  .sport-list{
    display:flex;
    overflow-x:auto;
    scrollbar-width:none;
    padding-bottom:3px;
  }
  .sport-list::-webkit-scrollbar{display:none}
  .sport-btn{
    width:auto;
    min-width:max-content;
    padding:9px 12px;
  }
  .toast-settings{
    display:flex;
    overflow-x:auto;
    scrollbar-width:none;
    margin-top:5px;
  }
  .toast-row{
    min-width:max-content;
    background:rgba(255,255,255,.22);
  }
  .main{margin-left:0}
  .topbar{
    height:auto;
    min-height:66px;
    padding:10px 14px;
  }
  .top-left h1{font-size:15px}
  .top-right{gap:8px}
  .clock{display:none}
  .push-box{padding:6px 7px}
  .push-label{font-size:9px}
  .content{padding:15px 13px 40px}
  .games-grid{grid-template-columns:1fr}
  .game-card{padding:15px}
  .toast-stack{right:10px;top:76px;width:calc(100vw - 20px)}
}
</style>
</head>

<body>
<div class="app-shell">

  <aside class="sidebar">
    <div class="brand">
      <i class="fi fi-rr-bolt"></i>
      <span>Sports Alerts</span>
    </div>

    <div class="sidebar-heading">Sports</div>
    <div class="sport-list" id="sport-list"></div>

    <div class="sidebar-heading">Scoring Toasts</div>
    <div class="toast-settings" id="toast-settings"></div>

    <div class="install-note" id="install-note">
      Install this app to your Home Screen before Push Alerts can be activated.
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="top-left">
        <h1 id="page-title">MLB Scores</h1>
        <p id="selected-date-label"></p>
      </div>

      <div class="top-right">
        <div class="clock">
          <span id="clock-time">--:-- AM</span>
          <small id="clock-date"></small>
        </div>

        <div class="push-box">
          <div>
            <div class="push-label">PUSH ALERTS</div>
            <div class="push-state" id="master-status-text">OFF</div>
          </div>
          <label class="toggle">
            <input id="master-push-toggle" type="checkbox">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </header>

    <section class="content">
      <div class="date-strip" id="date-strip"></div>

      <div class="section-head">
        <h2 id="games-title">Today's Games</h2>
        <span id="refresh-status">Live data</span>
      </div>

      <div class="games-grid" id="games-container">
        <div class="empty">Loading scores...</div>
      </div>
    </section>
  </main>
</div>

<div class="toast-stack" id="toast-stack"></div>

<script>
const VAPID_KEY =
'BA8NXZjt4Aj2NsNFZwFQJPvNHoGdz87nVB_0MJCQdbXFMhgOmkWsd-STbCKtgPIBPrWF7-Umqrili8Ef4xS352E';

const APP_ID='d1eje7SvxRjIFsdB6c3TuQLlF8v6zExAMBzChgXa';
const JS_KEY='eQqLLilvkNhy04m0OF5J4ry17vw0FKeeEHfPT2mq';

const URLS={
  mlb:'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard',
  nba:'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard',
  nfl:'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
  nhl:'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard',
  soccer:'https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/scoreboard',
  mma:'https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard'
};

const SPORTS={
  mlb:{name:'MLB',icon:'fi-rr-baseball'},
  nba:{name:'NBA',icon:'fi-rr-basketball'},
  nfl:{name:'NFL',icon:'fi-rr-football'},
  nhl:{name:'NHL',icon:'fi-rr-hockey-puck'},
  soccer:{name:'Soccer',icon:'fi-rr-soccer'},
  mma:{name:'MMA',icon:'fi-rr-boxing-glove'}
};

let currentSport=localStorage.getItem('activeSport')||'mlb';
let selectedDate=localDate(new Date());
let gamesCache=new Map();
let previousScores=JSON.parse(localStorage.getItem('espnScoreCache')||'{}');
let selectedGameIds=new Set(JSON.parse(localStorage.getItem('selectedGameIds')||'[]'));
let masterEnabled=localStorage.getItem('masterPushEnabled')==='true';
let toastPrefs=JSON.parse(localStorage.getItem('toastPrefs')||'{}');

Object.keys(SPORTS).forEach(s=>{
  if(typeof toastPrefs[s]!=='boolean')toastPrefs[s]=true;
});

function localDate(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function espnDate(d){
  return d.replaceAll('-','');
}

function esc(v){
  return String(v??'').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[m]));
}

function formatTime(iso){
  if(!iso)return '';
  const d=new Date(iso);
  return d.toLocaleTimeString([],{
    hour:'numeric',
    minute:'2-digit',
    hour12:true
  });
}

function formatLongDate(date){
  return new Date(date+'T12:00:00').toLocaleDateString([],{
    weekday:'long',month:'long',day:'numeric'
  });
}

function dateLabel(date){
  const d=new Date(date+'T12:00:00');
  return {
    day:d.toLocaleDateString([],{weekday:'short'}),
    num:d.getDate(),
    month:d.toLocaleDateString([],{month:'short'})
  };
}

function buildDates(){
  const strip=document.getElementById('date-strip');
  strip.innerHTML='';

  const today=new Date();
  for(let i=0;i<7;i++){
    const d=new Date(today);
    d.setDate(today.getDate()+i);
    const key=localDate(d);
    const x=dateLabel(key);
    const b=document.createElement('button');
    b.className='date-btn'+(key===selectedDate?' active':'');
    b.innerHTML=`
      <span class="day">${esc(i===0?'Today':x.day)}</span>
      <strong>${x.num}</strong>
      <span class="month">${esc(x.month)}</span>`;
    b.onclick=()=>{
      selectedDate=key;
      buildDates();
      loadSchedule();
    };
    strip.appendChild(b);
  }
}

function buildSports(){
  const list=document.getElementById('sport-list');
  const settings=document.getElementById('toast-settings');
  list.innerHTML='';
  settings.innerHTML='';

  Object.entries(SPORTS).forEach(([key,s])=>{
    const b=document.createElement('button');
    b.className='sport-btn'+(key===currentSport?' active':'');
    b.innerHTML=`<i class="fi ${s.icon}"></i><span>${s.name}</span>`;
    b.onclick=()=>{
      currentSport=key;
      localStorage.setItem('activeSport',key);
      buildSports();
      loadSchedule();
    };
    list.appendChild(b);

    const row=document.createElement('div');
    row.className='toast-row';
    row.innerHTML=`
      <span><i class="fi ${s.icon}"></i>${s.name}</span>
      <label class="toggle">
        <input type="checkbox" ${toastPrefs[key]?'checked':''}>
        <span class="toggle-slider"></span>
      </label>`;
    row.querySelector('input').onchange=e=>{
      toastPrefs[key]=e.target.checked;
      localStorage.setItem('toastPrefs',JSON.stringify(toastPrefs));
    };
    settings.appendChild(row);
  });

  document.getElementById('page-title').textContent=SPORTS[currentSport].name+' Scores';
}

function isInstalled(){
  return window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone===true;
}

function updateInstallUI(){
  const installed=isInstalled();
  const toggle=document.getElementById('master-push-toggle');
  const note=document.getElementById('install-note');

  toggle.disabled=!installed;

  note.textContent=installed
    ? 'Push Alerts are available. The main PUSH ALERTS switch must be ON before push delivery is enabled.'
    : 'Install this app to your Home Screen before Push Alerts can be activated.';

  if(!installed && masterEnabled)revertMasterSwitch(false);
}

function updateMasterLabel(){
  const el=document.getElementById('master-status-text');
  el.textContent=masterEnabled?'ON':'OFF';
  el.style.color=masterEnabled?'var(--green)':'var(--muted)';
}

async function toggleMasterPush(enabled){
  if(enabled&&!isInstalled()){
    revertMasterSwitch(false);
    showToastMessage('Push Alerts','Install the app to your Home Screen first.');
    return;
  }

  masterEnabled=enabled;
  localStorage.setItem('masterPushEnabled',enabled);
  updateMasterLabel();

  if(enabled){
    if(!('serviceWorker' in navigator)||!('PushManager' in window)){
      revertMasterSwitch(false);
      showToastMessage('Push Alerts','Web Push is not available on this device.');
      return;
    }

    try{
      const permission=await Notification.requestPermission();
      if(permission!=='granted'){
        revertMasterSwitch(false);
        showToastMessage('Push Alerts','Notification permission was not granted.');
        return;
      }
      await syncSubscriptionWithServer();
    }catch(e){
      console.error(e);
      revertMasterSwitch(false);
    }
  }else{
    await syncSubscriptionWithServer();
  }
}

function revertMasterSwitch(state){
  masterEnabled=state;
  localStorage.setItem('masterPushEnabled',state);
  document.getElementById('master-push-toggle').checked=state;
  updateMasterLabel();
}

async function syncSubscriptionWithServer(){
  try{
    const reg=await navigator.serviceWorker.register('/sw.js',{scope:'/'});
    await navigator.serviceWorker.ready;

    let sub=null;
    if(masterEnabled){
      sub=await reg.pushManager.getSubscription();
      if(!sub){
        sub=await reg.pushManager.subscribe({
          userVisibleOnly:true,
          applicationServerKey:urlBase64ToUint8Array(VAPID_KEY)
        });
      }
    }else{
      sub=await reg.pushManager.getSubscription();
    }

    await fetch(
      'https://parseapi.back4app.com/parse/functions/saveSubscription',
      {
        method:'POST',
        headers:{
          'X-Parse-Application-Id':APP_ID,
          'X-Parse-JavaScript-Key':JS_KEY,
          'Content-Type':'application/json'
        },
        body:JSON.stringify({
          subscription:masterEnabled&&sub?sub.toJSON():null,
          gameIds:masterEnabled?Array.from(selectedGameIds):[]
        })
      }
    );

    if(!masterEnabled&&sub){
      try{await sub.unsubscribe()}catch(e){}
    }
  }catch(e){
    console.error('Subscription Sync Error:',e);
  }
}

function toggleGameAlert(id,card){
  id=String(id);

  if(selectedGameIds.has(id)){
    selectedGameIds.delete(id);
  }else{
    if(!masterEnabled){
      showToastMessage(
        'Push Alerts',
        'Turn on the main PUSH ALERTS switch before enabling game alerts.'
      );
      return;
    }
    selectedGameIds.add(id);
  }

  localStorage.setItem(
    'selectedGameIds',
    JSON.stringify([...selectedGameIds])
  );

  updateCardAlert(card,id);

  if(masterEnabled)syncSubscriptionWithServer();
}

function updateCardAlert(card,id){
  const on=selectedGameIds.has(id);
  const btn=card.querySelector('.alert-btn');
  if(!btn)return;
  btn.classList.toggle('active',on);
  btn.innerHTML=`<i class="fi ${on?'fi-rr-bell':'fi-rr-bell-slash'}"></i> ${on?'Alerts On':'Alerts Off'}`;
}

function teamData(c){
  const team=c?.team||c?.athlete||{};
  return {
    name:team.shortDisplayName||team.displayName||team.name||'Team',
    logo:team.logo||'https://a.espncdn.com/i/espn/espn_logos/espn_red.png',
    record:c?.records?.[0]?.summary||'',
    score:c?.score??'0'
  };
}

function getSituation(event){
  const comp=event.competitions?.[0];
  const s=comp?.situation||event?.situation||{};
  const status=event.status?.type||{};
  const state=status.state;

  if(state!=='in')return '';

  const sport=currentSport;

  if(sport==='mlb'){
    const inning=s.inning||s.inningHalf||'';
    const outs=s.outs!=null?`${s.outs} out${s.outs===1?'':'s'}`:'';
    const balls=s.balls!=null?`Balls ${s.balls}`:'';
    const strikes=s.strikes!=null?`Strikes ${s.strikes}`:'';
    const runners=[];

    if(s.onFirst)runners.push('1st');
    if(s.onSecond)runners.push('2nd');
    if(s.onThird)runners.push('3rd');

    return [
      inning,
      balls,
      strikes,
      outs,
      runners.length?'Runners: '+runners.join(', '):'Bases empty'
    ].filter(Boolean).join(' · ');
  }

  if(sport==='nfl'){
    return [
      s.down?s.down+' down':'',
      s.distance?s.distance+' to go':'',
      s.yardLine?'Ball on '+s.yardLine:'',
      status.detail||''
    ].filter(Boolean).join(' · ');
  }

  if(sport==='nba'){
    return [status.period?'Q'+status.period:'',status.displayClock||'']
      .filter(Boolean).join(' · ');
  }

  if(sport==='nhl'){
    return [status.period?'P'+status.period:'',status.displayClock||'']
      .filter(Boolean).join(' · ');
  }

  if(sport==='soccer'){
    return status.detail||status.shortDetail||'Live';
  }

  return status.detail||'Live';
}

function gameMeta(event){
  const status=event.status?.type||{};
  const state=status.state;

  if(state==='in'){
    return status.detail||status.shortDetail||'Live';
  }

  if(state==='post'){
    return status.detail||'Final';
  }

  return `Start ${formatTime(event.date)}`;
}

function countdown(iso){
  const diff=new Date(iso)-Date.now();
  if(diff<=0)return '';

  const mins=Math.ceil(diff/60000);
  const hours=Math.floor(mins/60);
  const rem=mins%60;

  if(hours)return `Starts in ${hours}h ${String(rem).padStart(2,'0')}m`;
  return `Starts in ${mins}m`;
}

function createCard(event){
  const id=String(event.id);
  const card=document.createElement('article');
  card.className='game-card';
  card.dataset.id=id;

  card.innerHTML=`
    <div class="card-head">
      <span class="status"></span>
      <button class="alert-btn" type="button"></button>
    </div>
    <div class="teams">
      <div class="team away">
        <img class="team-logo" alt="">
        <div>
          <div class="team-name"></div>
          <span class="team-record"></span>
        </div>
        <div class="score"></div>
      </div>
      <div class="team home">
        <img class="team-logo" alt="">
        <div>
          <div class="team-name"></div>
          <span class="team-record"></span>
        </div>
        <div class="score"></div>
      </div>
    </div>
    <div class="game-meta">
      <span class="meta-left"></span>
      <span class="meta-right"></span>
    </div>
    <div class="situation hidden"></div>
  `;

  card.querySelector('.alert-btn').onclick=()=>{
    toggleGameAlert(id,card);
  };

  return card;
}

function updateCard(card,event){
  const comps=event.competitions?.[0]?.competitors||[];
  const away=teamData(comps.find(c=>c.homeAway==='away')||comps[0]);
  const home=teamData(comps.find(c=>c.homeAway==='home')||comps[1]);
  const status=event.status?.type||{};
  const live=status.state==='in';

  card.classList.toggle('live',live);

  const statusEl=card.querySelector('.status');
  statusEl.className='status'+(live?' live':'');
  statusEl.textContent=live
    ? 'Live'
    : status.state==='post'
      ? 'Final'
      : 'Upcoming';

  const setTeam=(selector,data)=>{
    const root=card.querySelector(selector);
    const img=root.querySelector('.team-logo');
    img.src=data.logo;
    img.alt=data.name;
    img.onerror=()=>img.src='https://a.espncdn.com/i/espn/espn_logos/espn_red.png';
    root.querySelector('.team-name').textContent=data.name;
    root.querySelector('.team-record').textContent=data.record;
    root.querySelector('.score').textContent=data.score;
  };

  setTeam('.away',away);
  setTeam('.home',home);

  const meta=card.querySelector('.game-meta');
  const left=gameMeta(event);
  const right=live?'Live tracking':'';

  meta.querySelector('.meta-left').textContent=left;
  meta.querySelector('.meta-right').textContent=right;

  const situation=getSituation(event);
  const sit=card.querySelector('.situation');

  if(situation){
    sit.classList.remove('hidden');
    sit.innerHTML=`<strong>Game Detail</strong><br>${esc(situation)}`;
  }else{
    const cd=status.state==='pre'?countdown(event.date):'';
    if(cd){
      sit.classList.remove('hidden');
      sit.innerHTML=`<strong class="countdown">${cd}</strong>`;
    }else{
      sit.classList.add('hidden');
      sit.textContent='';
    }
  }

  updateCardAlert(card,String(event.id));
}

function scoreValue(event){
  const comps=event.competitions?.[0]?.competitors||[];
  return comps.map(c=>`${c.homeAway}:${c.score??''}`).join('|');
}

function scoringChange(event){
  const id=String(event.id);
  const current=scoreValue(event);
  const old=previousScores[id];

  previousScores[id]=current;

  if(!old||old===current)return;

  const comps=event.competitions?.[0]?.competitors||[];
  const away=teamData(comps.find(c=>c.homeAway==='away')||comps[0]);
  const home=teamData(comps.find(c=>c.homeAway==='home')||comps[1]);

  const oldParts=Object.fromEntries(
    old.split('|').map(x=>x.split(':'))
  );

  const changed=comps.find(c=>{
    const oldScore=oldParts[c.homeAway];
    return oldScore!=null&&String(oldScore)!==String(c.score??'');
  });

  if(!changed)return;

  const scoring=teamData(changed);
  const detail=buildScoringDetail(event,scoring,away,home);

  if(toastPrefs[currentSport]){
    showScoringToast(scoring,detail);
  }
}

function buildScoringDetail(event,scoring,away,home){
  const status=event.status?.type||{};
  const note=
    event.competitions?.[0]?.notes?.[0]?.headline||
    event.competitions?.[0]?.details||
    status.shortDetail||
    status.detail||
    'Scoring play';

  return {
    title:note,
    score:`${away.name}: ${away.score} - ${home.name}: ${home.score}`
  };
}

function showScoringToast(scoring,detail){
  const stack=document.getElementById('toast-stack');
  const toast=document.createElement('div');
  toast.className='toast';

  toast.innerHTML=`
    <img class="toast-logo" src="${esc(scoring.logo)}" alt="${esc(scoring.name)}">
    <div>
      <div class="toast-title">${esc(scoring.name)} scored</div>
      <div class="toast-text">${esc(detail.title)}</div>
      <div class="toast-score">${esc(detail.score)}</div>
    </div>`;

  stack.prepend(toast);
  setTimeout(()=>toast.remove(),6500);
}

function showToastMessage(title,text){
  const stack=document.getElementById('toast-stack');
  const toast=document.createElement('div');
  toast.className='toast';

  toast.innerHTML=`
    <div></div>
    <div>
      <div class="toast-title">${esc(title)}</div>
      <div class="toast-text">${esc(text)}</div>
    </div>`;

  stack.prepend(toast);
  setTimeout(()=>toast.remove(),4500);
}

async function loadSchedule(){
  const container=document.getElementById('games-container');
  document.getElementById('selected-date-label').textContent=
    formatLongDate(selectedDate);

  document.getElementById('games-title').textContent=
    selectedDate===localDate(new Date())
      ? "Today's Games"
      : 'Games';

  const url=URLS[currentSport]+'?dates='+espnDate(selectedDate);

  try{
    const res=await fetch(url,{cache:'no-store'});
    if(!res.ok)throw new Error('ESPN request failed');

    const data=await res.json();
    const events=data.events||[];
    const incoming=new Set();

    if(!events.length){
      container.innerHTML='<div class="empty">No games scheduled for this date.</div>';
      gamesCache.clear();
      return;
    }

    const empty=container.querySelector('.empty');
    if(empty)empty.remove();

    events.forEach(event=>{
      const id=String(event.id);
      incoming.add(id);

      let card=gamesCache.get(id);

      if(!card){
        card=createCard(event);
        gamesCache.set(id,card);
        container.appendChild(card);
      }

      scoringChange(event);
      updateCard(card,event);
    });

    [...gamesCache.entries()].forEach(([id,card])=>{
      if(!incoming.has(id)){
        card.remove();
        gamesCache.delete(id);
      }
    });

    localStorage.setItem(
      'espnScoreCache',
      JSON.stringify(previousScores)
    );

    document.getElementById('refresh-status').textContent=
      'Updated '+formatTime(new Date().toISOString());

  }catch(err){
    console.error(err);

    if(!gamesCache.size){
      container.innerHTML=
        '<div class="error">Unable to load live scores.</div>';
    }
  }
}

function updateClock(){
  const now=new Date();

  document.getElementById('clock-time').textContent=
    now.toLocaleTimeString([],{
      hour:'numeric',
      minute:'2-digit',
      hour12:true
    });

  document.getElementById('clock-date').textContent=
    now.toLocaleDateString([],{
      weekday:'short',
      month:'short',
      day:'numeric'
    });

  document.querySelectorAll('.countdown').forEach(el=>{
    const card=el.closest('.game-card');
    const id=card?.dataset.id;
    const event=gamesCache.get(id)?.__event;
    if(event){
      const cd=countdown(event.date);
      el.textContent=cd;
    }
  });
}

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding)
    .replace(/-/g,'+')
    .replace(/_/g,'/');
  const rawData=atob(base64);
  const outputArray=new Uint8Array(rawData.length);

  for(let i=0;i<rawData.length;i++){
    outputArray[i]=rawData.charCodeAt(i);
  }

  return outputArray;
}

document.getElementById('master-push-toggle').onchange=e=>{
  toggleMasterPush(e.target.checked);
};

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden)loadSchedule();
});

buildSports();
buildDates();
updateMasterLabel();
updateInstallUI();
loadSchedule();
updateClock();

setInterval(updateClock,30000);
setInterval(()=>{
  if(!document.hidden)loadSchedule();
},30000);

window.addEventListener('appinstalled',()=>{
  updateInstallUI();
});
