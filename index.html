<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8e2de2">
  <link rel="manifest" href="manifest.json">
  <title>Live Sports Updates</title>
  <link rel="stylesheet" href="styles.css">
  <script type="text/javascript" src="https://npmcdn.com/parse/dist/parse.min.js"></script>
</head>
<body>
  <header class="espn-header">
    <div class="logo">SPORTS LIVE</div>
    
    <!-- Sport Selector Dropdown -->
    <div class="sport-selector-container">
      <select id="sportSelect" class="sport-select" onchange="window.changeSport(this.value)">
        <option value="basketball/nba">NBA</option>
        <option value="football/nfl">NFL</option>
        <option value="baseball/mlb">MLB</option>
        <option value="hockey/nhl">NHL</option>
        <option value="soccer/eng.1">Soccer (Premier League)</option>
        <option value="soccer/uefa.champions">Soccer (Champions League)</option>
        <option value="mma/ufc">MMA (UFC)</option>
        <option value="football/college-football">NCAA Football</option>
        <option value="basketball/mens-college-basketball">NCAA Men's Basketball</option>
      </select>
    </div>
  </header>

  <main class="container">
    <div id="scoreboard" class="grid-layout">
      <!-- Liquid Glass Cards injected here via JS -->
    </div>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
