<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Sports Alerts</title>
  <link rel="manifest" href="/manifest.json">
  <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; margin: 0; }
    h1 { text-align: center; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; max-width: 1000px; margin: 20px auto; }
    .card { background: #1e293b; border-radius: 12px; padding: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); border: 1px solid #334155; }
    .teams { font-weight: bold; font-size: 1.1em; margin-bottom: 8px; }
    .score { font-size: 1.5em; color: #38bdf8; margin: 8px 0; }
    .status { font-size: 0.85em; color: #94a3b8; margin-bottom: 12px; }
    button { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: bold; }
    button:disabled { background: #475569; cursor: not-allowed; }
  </style>
</head>
<body>
  <h1>Live Sports Scoreboard</h1>
  <div id="scoreboard" class="grid"></div>

  <script src="app.js"></script>
</body>
</html>
