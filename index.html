<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESPN Live Sports Center</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <!-- Reliable Parse SDK CDN -->
  <script src="https://unpkg.com/parse/dist/parse.min.js"></script>
</head>
<body>

  <div class="app-layout">
    
    <!-- STICKY SIDE NAVIGATION -->
    <aside class="sidebar">
      <div class="sidebar-header">CATEGORIES</div>
      <nav class="categories-nav" id="categoriesNav">
        <button class="nav-btn active" data-sport="baseball/mlb" data-title="BASEBALL SCORES">Baseball (MLB)</button>
        <button class="nav-btn" data-sport="football/nfl" data-title="FOOTBALL SCORES">Football (NFL)</button>
        <button class="nav-btn" data-sport="basketball/nba" data-title="BASKETBALL SCORES">Basketball (NBA)</button>
        <button class="nav-btn" data-sport="hockey/nhl" data-title="HOCKEY SCORES">Hockey (NHL)</button>
        <button class="nav-btn" data-sport="soccer/eng.1" data-title="PREMIER LEAGUE SCORES">Premier League</button>
        <button class="nav-btn" data-sport="soccer/usa.1" data-title="MAJOR LEAGUE SOCCER">Major League Soccer</button>
        <button class="nav-btn" data-sport="mma/ufc" data-title="MMA / UFC SCORES">MMA / UFC</button>
        <button class="nav-btn" data-sport="basketball/mens-college-basketball" data-title="NCAA BASKETBALL">NCAA Basketball</button>
        <button class="nav-btn" data-sport="football/college-football" data-title="NCAA FOOTBALL">NCAA Football</button>
      </nav>
    </aside>

    <!-- MAIN BODY AREA -->
    <div class="main-content">
      
      <!-- STICKY TOP HEADER WITH DATE NAV -->
      <header class="top-header">
        <div class="header-top-row">
          <h1 class="page-title" id="pageTitle">BASEBALL SCORES</h1>
          <div class="header-actions">
            <button id="btnSubscribe" class="btn-action">Enable Push</button>
            <button id="btnUnsubscribe" class="btn-action btn-danger" style="display: none;">Unsubscribe</button>
            <button id="btnTestPush" class="btn-action btn-blue">Test Push</button>
          </div>
        </div>

        <!-- DATE NAVIGATION BAR -->
        <div class="date-control-bar">
          <button id="btnPrevDate" class="date-nav-btn">&lt;</button>
          <span class="date-display" id="dateDisplay">LOADING DATE...</span>
          <button id="btnNextDate" class="date-nav-btn">&gt;</button>
          <input type="date" id="datePicker" class="date-picker-input">
        </div>
      </header>

      <!-- PWA NOTICE BANNER -->
      <div id="pwaBanner" class="pwa-notice" style="display: none;">
        <span>📲 Please add this app to your Home Screen to enable live push notifications.</span>
      </div>

      <!-- LIVE SCORE CARDS GRID (SIDE BY SIDE 2-COLUMN) -->
      <main class="games-grid" id="scoreboardContainer">
        <div class="empty-state">Connecting to Live ESPN Scoreboard Stream...</div>
      </main>

    </div>

  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
