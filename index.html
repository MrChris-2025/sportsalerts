<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d9dee7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://cdn-uicons.flaticon.com/2.6.0/uicons-solid-rounded.css">
<title>Sports Alerts</title>

<style>
:root{
  --bg:#d9dee7;--panel:#dfe4ec;--panel2:#d5dae3;--text:#202734;
  --muted:#687385;--accent:#315fba;--green:#24845d;--red:#b64d55;
  --shadow1:10px 10px 22px #b9bec7,-10px -10px 22px #f8fbff;
  --shadow2:5px 5px 12px #bcc1ca,-5px -5px 12px #f8fbff;
  --inset:inset 4px 4px 9px #bec3cc,inset -4px -4px 9px #f8fbff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
}
button{font:inherit;color:inherit}
.app{min-height:100vh;padding-left:245px}
.sidebar{
  position:fixed;z-index:50;left:18px;top:18px;bottom:18px;width:207px;
  background:var(--panel);border-radius:26px;padding:20px 14px;
  box-shadow:var(--shadow1);display:flex;flex-direction:column;overflow:auto
}
.brand{font-size:21px;font-weight:900;padding:6px 10px 22px;letter-spacing:-.7px}
.brand span{color:var(--accent)}
.rail-title{
  font-size:10px;text-transform:uppercase;letter-spacing:1.3px;
  color:var(--muted);font-weight:900;padding:0 11px 8px
}
.sport-list{display:grid;gap:7px}
.sport-btn,.toast-sport{
  border:0;background:transparent;border-radius:14px;cursor:pointer;
  transition:box-shadow .18s,background .18s
}
.sport-btn{
  display:flex;align-items:center;gap:12px;padding:11px 12px;
  font-size:13px;font-weight:800;color:var(--muted)
}
.sport-btn i{font-size:17px;width:20px;text-align:center}
.sport-btn.active{
  color:var(--accent);background:var(--panel2);box-shadow:var(--inset)
}
.toast-section{margin-top:24px}
.toast-row{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;padding:9px 10px;font-size:12px;font-weight:800;color:var(--muted)
}
.mini-switch{position:relative;width:39px;height:21px;display:inline-block}
.mini-switch input{opacity:0;width:0;height:0}
.mini-slider{
  position:absolute;inset:0;border-radius:30px;background:#bfc5ce;
  box-shadow:var(--inset);cursor:pointer
}
.mini-slider:before{
  content:"";position:absolute;width:15px;height:15px;left:3px;top:3px;
  border-radius:50%;background:#f7f9fc;box-shadow:2px 2px 5px #aeb4bd;
  transition:transform .2s
}
.mini-switch input:checked+.mini-slider:before{transform:translateX(18px)}
.mini-switch input:checked+.mini-slider{background:#7391c7}

.topbar{
  position:sticky;top:0;z-index:40;height:74px;padding:12px 25px;
  background:rgba(217,222,231,.94);backdrop-filter:blur(14px);
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid rgba(255,255,255,.5)
}
.top-left h1{font-size:20px;font-weight:900}
.top-left p{font-size:11px;color:var(--muted);margin-top:2px}
.top-right{display:flex;align-items:center;gap:15px}
.clock{text-align:right}
.clock strong{display:block;font-size:15px}
.clock small{color:var(--muted);font-size:10px}
.master{
  display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:15px;
  box-shadow:var(--shadow2);font-size:10px;font-weight:900
}
.master b{color:var(--muted)}
.master.on b{color:var(--green)}
.switch{position:relative;width:43px;height:23px}
.switch input{opacity:0;width:0;height:0}
.slider{
  position:absolute;inset:0;border-radius:30px;background:#bdc3cc;
  box-shadow:var(--inset);cursor:pointer
}
.slider:before{
  content:"";position:absolute;width:17px;height:17px;top:3px;left:3px;
  border-radius:50%;background:#fff;box-shadow:2px 2px 5px #adb3bc;
  transition:transform .2s
}
.switch input:checked+.slider{background:#7190c8}
.switch input:checked+.slider:before{transform:translateX(20px)}

.content{max-width:1500px;margin:auto;padding:22px 25px 50px}
.install{
  display:none;margin-bottom:18px;padding:14px 17px;border-radius:18px;
  box-shadow:var(--shadow2);align-items:center;justify-content:space-between;gap:12px
}
.install.show{display:flex}
.install button,.install-guide{
  border:0;background:var(--accent);color:#fff;border-radius:12px;
  padding:8px 13px;font-weight:800;cursor:pointer
}
.week{
  display:flex;gap:9px;overflow-x:auto;padding:4px 3px 18px;
  scrollbar-width:none
}
.week::-webkit-scrollbar{display:none}
.day{
  min-width:92px;padding:11px 8px;text-align:center;border:0;
  border-radius:16px;background:var(--panel);box-shadow:var(--shadow2);
  cursor:pointer
}
.day strong{display:block;font-size:11px;text-transform:uppercase}
.day span{display:block;margin-top:3px;font-size:18px;font-weight:900}
.day small{font-size:9px;color:var(--muted)}
.day.active{color:var(--accent);box-shadow:var(--inset)}
.section-head{
  display:flex;align-items:end;justify-content:space-between;margin-bottom:14px
}
.section-head h2{font-size:18px;font-weight:900}
.section-head span{font-size:11px;color:var(--muted)}
.cards{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px
}
.card{
  min-width:0;padding:17px;border-radius:21px;background:var(--panel);
  box-shadow:var(--shadow2);transition:box-shadow .18s
}
.card.selected{box-shadow:var(--inset)}
.card-head{
  display:flex;justify-content:space-between;align-items:center;
  border-bottom:1px solid rgba(120,130,145,.15);padding-bottom:10px;margin-bottom:12px
}
.status{font-size:10px;font-weight:900;color:var(--muted);text-transform:uppercase}
.status.live{color:var(--red)}
.alert-btn{
  border:0;border-radius:10px;padding:6px 8px;background:var(--panel);
  box-shadow:var(--shadow2);font-size:10px;font-weight:900;cursor:pointer
}
.alert-btn.active{color:var(--accent);box-shadow:var(--inset)}
.team{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;margin:9px 0}
.logo{width:31px;height:31px;object-fit:contain}
.team-name{font-size:13px;font-weight:850;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.record{display:block;color:var(--muted);font-size:9px;margin-top:2px}
.score{font-size:22px;font-weight:950}
.live-detail{
  margin-top:11px;padding:9px 10px;border-radius:12px;background:var(--panel2);
  box-shadow:var(--inset);font-size:10px;color:var(--muted);line-height:1.5
}
.live-detail strong{color:var(--text)}
.base{
  display:flex;gap:5px;align-items:center;margin-top:7px
}
.base i{
  width:9px;height:9px;background:#aeb5c0;transform:rotate(45deg);
  display:block;border-radius:2px
}
.base i.on{background:#c38a37}
.empty{
  grid-column:1/-1;text-align:center;padding:55px 20px;color:var(--muted);
  border-radius:20px;box-shadow:var(--inset)
}
#toast-wrap{
  position:fixed;right:22px;top:84px;z-index:100;display:grid;
  gap:10px;width:min(380px,calc(100vw - 30px));pointer-events:none
}
.toast{
  pointer-events:auto;display:grid;grid-template-columns:40px 1fr;
  gap:10px;align-items:center;padding:12px;border-radius:17px;
  background:var(--panel);box-shadow:var(--shadow1);animation:toastIn .22s ease
}
.toast-logo{width:34px;height:34px;object-fit:contain}
.toast-title{font-size:11px;font-weight:950}
.toast-text{font-size:10px;color:var(--muted);line-height:1.35;margin-top:2px}
@keyframes toastIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media(max-width:900px){
  .app{padding-left:0}
  .sidebar{
    position:sticky;top:0;left:auto;bottom:auto;width:100%;height:auto;
    margin:0;border-radius:0;padding:9px 10px;z-index:45;display:block
  }
  .brand{display:none}
  .rail-title{display:none}
  .sport-list{display:flex;overflow-x:auto}
  .sport-btn{min-width:max-content;padding:9px 12px}
  .toast-section{display:flex;gap:5px;overflow-x:auto;margin:7px 0 0}
  .toast-row{min-width:max-content;padding:5px 8px}
  .topbar{padding:10px 15px}
  .content{padding:15px}
}
@media(max-width:620px){
  .topbar{height:68px}
  .top-left h1{font-size:16px}
  .clock strong{font-size:13px}
  .master{padding:7px}
  .master b{display:none}
  .cards{grid-template-columns:1fr}
  .content{padding:13px}
  #toast-wrap{right:15px;top:75px}
}
</style>
</head>

<body>
<div class="app">

  <aside class="sidebar">
    <div class="brand">SPORTS <span>ALERTS</span></div>

    <div class="rail-title">Sports</div>
    <div class="sport-list" id="sport-list">
      <button class="sport-btn active" data-sport="mlb"><i class="fi fi-sr-baseball"></i>MLB</button>
      <button class="sport-btn" data-sport="nba"><i class="fi fi-sr-basketball"></i>NBA</button>
      <button class="sport-btn" data-sport="nfl"><i class="fi fi-sr-football"></i>NFL</button>
      <button class="sport-btn" data-sport="nhl"><i class="fi fi-sr-hockey-puck"></i>NHL</button>
      <button class="sport-btn" data-sport="soccer"><i class="fi fi-sr-soccer"></i>Soccer</button>
      <button class="sport-btn" data-sport="mma"><i class="fi fi-sr-boxing-glove"></i>MMA</button>
    </div>

    <div class="toast-section">
      <div class="rail-title">Scoring Toasts</div>
      <div class="toast-row">MLB <label class="mini-switch"><input type="checkbox" data-toast="mlb"><span class="mini-slider"></span></label></div>
      <div class="toast-row">NBA <label class="mini-switch"><input type="checkbox" data-toast="nba"><span class="mini-slider"></span></label></div>
      <div class="toast-row">NFL <label class="mini-switch"><input type="checkbox" data-toast="nfl"><span class="mini-slider"></span></label></div>
      <div class="toast-row">NHL <label class="mini-switch"><input type="checkbox" data-toast="nhl"><span class="mini-slider"></span></label></div>
      <div class="toast-row">Soccer <label class="mini-switch"><input type="checkbox" data-toast="soccer"><span class="mini-slider"></span></label></div>
      <div class="toast-row">MMA <label class="mini-switch"><input type="checkbox" data-toast="mma"><span class="mini-slider"></span></label></div>
    </div>
  </aside>

  <header class="topbar">
    <div class="top-left">
      <h1>Live Scores</h1>
      <p id="today-label"></p>
    </div>
    <div class="top-right">
      <div class="clock"><strong id="clock">--:-- AM</strong><small>Local Time</small></div>
      <div class="master" id="master-box">
        <b id="master-text">PUSH ALERTS OFF</b>
        <label class="switch">
          <input id="master-push-toggle" type="checkbox">
          <span class="slider"></span>
        </label>
      </div>
    </div>
  </header>

  <main class="content">
    <div class="install" id="install-box">
      <div>
        <strong>Install Sports Alerts</strong>
        <div style="font-size:10px;color:var(--muted);margin-top:3px">
          Install this app before push alerts can be enabled.
        </div>
      </div>
      <button id="install-btn">Add to Home Screen</button>
    </div>

    <div class="week" id="week"></div>

    <div class="section-head">
      <h2 id="section-title">MLB Scores</h2>
      <span id="refresh-status">Live</span>
    </div>

    <section class="cards" id="games-container"></section>
  </main>
</div>

<div id="toast-wrap"></div>

<script>
const VAPID_KEY='BA8NXZjt4Aj2NsNFZwFQJPvNHoGdz87nVB_0MJCQdbXFMhgOmkWsd-STbCKtgPIBPrWF7-Umqrili8Ef4xS352E';
const APP_ID='d1eje7SvxRjIFsdB6c3TuQLlF8v6zExAMBzChgXa';
const JS_KEY='eQqLLilvkNhy04m0OF5J4ry17vw0FKeeEHfPT2mq';

const URLS={
 mlb:'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard',
 nba:'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard',
 nfl:'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
 nhl:'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard',
 soccer:'https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/scoreboard',
 mma:'https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard'
};

const SPORTS=['mlb','nba','nfl','nhl','soccer','mma'];
const NAMES={mlb:'MLB',nba:'NBA',nfl:'NFL',nhl:'NHL',soccer:'Soccer',mma:'MMA'};
const ICONS={mlb:'fi fi-sr-baseball',nba:'fi fi-sr-basketball',nfl:'fi fi-sr-football',nhl:'fi fi-sr-hockey-puck',soccer:'fi fi-sr-soccer',mma:'fi fi-sr-boxing-glove'};
let currentSport='mlb', currentDate=new Date(), deferredPrompt=null, firstLoad=true;
let selectedGameIds=new Set(JSON.parse(localStorage.getItem('selectedGameIds')||'[]'));
let masterEnabled=localStorage.getItem('masterPushEnabled')==='true';
let toastSettings=JSON.parse(localStorage.getItem('toastSettings')||'{}');
let previousGames={};

function esc(v=''){
 return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}
function isoDate(d){return d.toISOString().slice(0,10)}
function dateParam(){
 return isoDate(currentDate);
}
function installed(){
 return window.matchMedia('(display-mode: standalone)').matches ||
        window.navigator.standalone===true ||
        document.referrer.includes('android-app://');
}
function updateClock(){
 const d=new Date();
 document.getElementById('clock').textContent=d.toLocaleTimeString([],{
   hour:'numeric',minute:'2-digit',hour12:true
 });
 document.getElementById('today-label').textContent=d.toLocaleDateString([],{
   weekday:'long',month:'long',day:'numeric',year:'numeric'
 });
}
function buildWeek(){
 const box=document.getElementById('week'),base=new Date();
 box.innerHTML='';
 for(let i=0;i<7;i++){
   const d=new Date(base);d.setDate(base.getDate()+i);
   const b=document.createElement('button');
   b.className='day '+(isoDate(d)===isoDate(currentDate)?'active':'');
   b.innerHTML=`<strong>${d.toLocaleDateString([], {weekday:'short'})}</strong>
     <span>${d.getDate()}</span><small>${d.toLocaleDateString([], {month:'short'})}</small>`;
   b.onclick=()=>{currentDate=d;buildWeek();loadSchedule(currentSport,true)};
   box.appendChild(b);
 }
}
function setupInstall(){
 const box=document.getElementById('install-box');
 if(!installed())box.classList.add('show');
 window.addEventListener('beforeinstallprompt',e=>{
   e.preventDefault();deferredPrompt=e;box.classList.add('show');
 });
 document.getElementById('install-btn').onclick=async()=>{
   if(deferredPrompt){
     deferredPrompt.prompt();
     await deferredPrompt.userChoice;
     deferredPrompt=null;
   }else alert('Use your browser menu and choose Add to Home Screen.');
 };
}
function setupToggles(){
 document.querySelectorAll('[data-toast]').forEach(x=>{
   x.checked=!!toastSettings[x.dataset.toast];
   x.onchange=()=>{
     toastSettings[x.dataset.toast]=x.checked;
     localStorage.setItem('toastSettings',JSON.stringify(toastSettings));
   };
 });
 const t=document.getElementById('master-push-toggle');
 t.checked=masterEnabled;
 t.onchange=()=>toggleMasterPush(t.checked);
}
async function toggleMasterPush(enable){
 if(enable&&!installed()){
   alert('Add Sports Alerts to your Home Screen before enabling PUSH ALERTS.');
   document.getElementById('master-push-toggle').checked=false;
   return;
 }
 if(enable&&!'Notification' in window){
   alert('Push notifications are not supported by this browser.');
   document.getElementById('master-push-toggle').checked=false;
   return;
 }
 try{
   if(enable){
     const permission=await Notification.requestPermission();
     if(permission!=='granted')throw Error('Notification permission was not granted.');
     await syncSubscriptionWithServer(true);
   }else{
     await syncSubscriptionWithServer(false);
   }
   masterEnabled=enable;
   localStorage.setItem('masterPushEnabled',enable);
   updateMasterUI();
 }catch(e){
   console.error(e);
   masterEnabled=false;
   localStorage.setItem('masterPushEnabled','false');
   document.getElementById('master-push-toggle').checked=false;
   alert(e.message||'Unable to enable push alerts.');
 }
}
function updateMasterUI(){
 const box=document.getElementById('master-box');
 box.classList.toggle('on',masterEnabled);
 document.getElementById('master-text').textContent=masterEnabled?'PUSH ALERTS ON':'PUSH ALERTS OFF';
}
async function syncSubscriptionWithServer(enabled){
 const reg=await navigator.serviceWorker.register('/sw.js',{scope:'/'});
 await navigator.serviceWorker.ready;
 let sub=null;
 if(enabled){
   sub=await reg.pushManager.subscribe({
     userVisibleOnly:true,
     applicationServerKey:urlBase64ToUint8Array(VAPID_KEY)
   });
 }
 await fetch('https://parseapi.back4app.com/parse/functions/saveSubscription',{
   method:'POST',
   headers:{
    'X-Parse-Application-Id':APP_ID,
    'X-Parse-JavaScript-Key':JS_KEY,
    'Content-Type':'application/json'
   },
   body:JSON.stringify({
     subscription:enabled?sub.toJSON():null,
     gameIds:enabled?[...selectedGameIds]:[]
   })
 });
}
function toggleGameAlert(id){
 id=String(id);
 if(selectedGameIds.has(id))selectedGameIds.delete(id);
 else selectedGameIds.add(id);
 localStorage.setItem('selectedGameIds',JSON.stringify([...selectedGameIds]));
 renderCards(previousGames[currentSport]||[],true);
 if(masterEnabled)syncSubscriptionWithServer(true).catch(console.error);
}
function switchSport(s){
 currentSport=s;
 document.querySelectorAll('.sport-btn').forEach(b=>b.classList.toggle('active',b.dataset.sport===s));
 document.getElementById('section-title').textContent=NAMES[s]+' Scores';
 loadSchedule(s,true);
}
function getTeam(c){
 return {
   name:c?.team?.shortDisplayName||c?.team?.displayName||c?.athlete?.displayName||'Team',
   logo:c?.team?.logo||c?.athlete?.headshot||'',
   record:c?.records?.[0]?.summary||'',
   score:c?.score??'0'
 };
}
function situation(e,cat){
 const c=e.competitions?.[0],s=c?.situation||e.situation||{};
 if(cat==='mlb'){
   const outs=s.outs,balls=s.balls,strikes=s.strikes;
   const parts=[];
   if(outs!==undefined)parts.push(`Outs: <strong>${outs}</strong>`);
   if(balls!==undefined)parts.push(`Balls: <strong>${balls}</strong>`);
   if(strikes!==undefined)parts.push(`Strikes: <strong>${strikes}</strong>`);
   const bases=(s.onFirst||s.onSecond||s.onThird);
   let base='';
   if(bases)base=`<div class="base">
      <i class="${s.onThird?'on':''}"></i><i class="${s.onSecond?'on':''}"></i><i class="${s.onFirst?'on':''}"></i>
      <span style="margin-left:4px">Bases</span></div>`;
   return parts.length?parts.join(' · ')+base:'';
 }
 if(cat==='nfl'){
   const p=s.possessionText||s.downDistanceText||s.shortDownDistanceText;
   return p?`<strong>${esc(p)}</strong>`:'';
 }
 if(cat==='nba'||cat==='nhl'||cat==='soccer'){
   const q=e.status?.period||s.period;
   const clock=e.status?.displayClock||s.displayClock||'';
   return q?`Period <strong>${esc(q)}</strong> · <strong>${esc(clock)}</strong>`:'';
 }
 return '';
}
function gameDetail(e,cat){
 const st=e.status?.type;
 const detail=st?.detail||st?.shortDetail||'Scheduled';
 const state=st?.state==='in';
 const situ=situation(e,cat);
 return {detail,state,situ};
}
function renderCards(events,initial=false){
 previousGames[currentSport]=events;
 const box=document.getElementById('games-container');
 if(!events.length){
   box.innerHTML='<div class="empty">No games scheduled for this date.</div>';
   return;
 }
 const old={};
 [...box.children].forEach(c=>{if(c.dataset.id)old[c.dataset.id]=c});
 const fragment=document.createDocumentFragment();
 events.forEach(e=>{
   const id=String(e.id),comp=e.competitions?.[0]||{},cs=comp.competitors||[];
   const away=cs.find(c=>c.homeAway==='away')||cs[0],home=cs.find(c=>c.homeAway==='home')||cs[1];
   const a=getTeam(away),h=getTeam(home),d=gameDetail(e,currentSport);
   const subscribed=selectedGameIds.has(id);
   let card=old[id];
   if(!card){
     card=document.createElement('article');
     card.className='card';
     card.dataset.id=id;
   }
   card.classList.toggle('selected',subscribed);
   card.innerHTML=`
    <div class="card-head">
      <span class="status ${d.state?'live':''}">${esc(d.detail)}</span>
      <button class="alert-btn ${subscribed?'active':''}" onclick="toggleGameAlert('${id}')">
       <i class="${subscribed?'fi fi-sr-bell':'fi fi-sr-bell-slash'}"></i>
       ${subscribed?'Alert On':'Alert Off'}
      </button>
    </div>
    <div class="team">
      <img class="logo" src="${esc(a.logo)}" alt="">
      <div><div class="team-name">${esc(a.name)}</div><span class="record">${esc(a.record)}</span></div>
      <strong class="score">${esc(a.score)}</strong>
    </div>
    <div class="team">
      <img class="logo" src="${esc(h.logo)}" alt="">
      <div><div class="team-name">${esc(h.name)}</div><span class="record">${esc(h.record)}</span></div>
      <strong class="score">${esc(h.score)}</strong>
    </div>
    ${d.state&&d.situ?`<div class="live-detail">${d.situ}</div>`:''}`;
   const imgs=card.querySelectorAll('.logo');
   imgs.forEach(i=>i.onerror=()=>i.style.visibility='hidden');
   fragment.appendChild(card);
 });
 box.replaceChildren(fragment);
}
async function loadSchedule(cat,force=false){
 const box=document.getElementById('games-container');
 if(firstLoad||force&&!previousGames[cat]){
   box.innerHTML='<div class="empty">Loading scores...</div>';
   firstLoad=false;
 }
 try{
   const sep=URLS[cat].includes('?')?'&':'?';
   const url=URLS[cat]+sep+'dates='+dateParam().replaceAll('-','');
   const res=await fetch(url,{cache:'no-store'});
   if(!res.ok)throw Error('Score request failed');
   const data=await res.json();
   const events=data.events||[];
   detectScoringChanges(cat,events);
   renderCards(events);
   document.getElementById('refresh-status').textContent=
     'Updated '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
 }catch(e){
   console.error(e);
   if(!previousGames[cat]?.length)
     box.innerHTML='<div class="empty">Unable to load scores.</div>';
 }
}
function detectScoringChanges(cat,events){
 const oldMap=previousGames[cat]||[];
 const old={};
 oldMap.forEach(e=>old[e.id]=e);
 events.forEach(e=>{
   const before=old[e.id],a=e.competitions?.[0]?.competitors||[];
   if(!before)return;
   const ba=before.competitions?.[0]?.competitors||[];
   a.forEach(c=>{
     const prev=ba.find(x=>x.id===c.id);
     if(prev&&Number(c.score)>Number(prev.score)&&toastSettings[cat])
       showScoreToast(e,c);
   });
 });
}
function showScoreToast(e,scoring){
 const cs=e.competitions?.[0]?.competitors||[];
 const away=cs.find(c=>c.homeAway==='away'),home=cs.find(c=>c.homeAway==='home');
 const score=c=>c?.score??'0';
 const detail=e.status?.type?.detail||e.status?.type?.shortDetail||'Live';
 const team=scoring.team?.shortDisplayName||scoring.team?.displayName||'Team';
 let play=e.competitions?.[0]?.details?.[0]?.text||
          e.competitions?.[0]?.status?.type?.detail||'Scoring play';
 if(currentSport==='nfl'&&e.competitions?.[0]?.situation)
   play=e.competitions[0].situation.lastPlay?.text||play;
 const toast=document.createElement('div');
 toast.className='toast';
 toast.innerHTML=`
   <img class="toast-logo" src="${esc(scoring.team?.logo||'')}" alt="">
   <div><div class="toast-title">${esc(play)}</div>
   <div class="toast-text">${esc(team)}: ${esc(score(away))} - ${esc(team===
     (home?.team?.shortDisplayName||home?.team?.displayName)?away?.team?.shortDisplayName||'Away':
     home?.team?.shortDisplayName||home?.team?.displayName||'Home')}: ${esc(score(home))} · ${esc(detail)}</div></div>`;
 document.getElementById('toast-wrap').prepend(toast);
 setTimeout(()=>toast.remove(),6500);
}
function urlBase64ToUint8Array(s){
 const p='='.repeat((4-s.length%4)%4),b=(s+p).replace(/-/g,'+').replace(/_/g,'/');
 const raw=atob(b),a=new Uint8Array(raw.length);
 for(let i=0;i<raw.length;i++)a[i]=raw.charCodeAt(i);
 return a;
}
document.querySelectorAll('.sport-btn').forEach(b=>b.onclick=()=>switchSport(b.dataset.sport));
updateClock();setInterval(updateClock,1000);
buildWeek();setupInstall();setupToggles();updateMasterUI();
loadSchedule(currentSport,true);

/* Silent refresh: cards are updated in place and only the final DOM
   replacement occurs, preventing the loading/flicker effect. */
setInterval(()=>loadSchedule(currentSport),30000);
</script>
