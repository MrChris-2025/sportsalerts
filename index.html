<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESPN Live Sports Center</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
  <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
</head>
<body>

  <header class="top-header">
    <div class="header-left">
      <h1 class="page-title">ESPN LIVE</h1>
      <span class="date-badge" id="currentDateBadge">Loading...</span>
    </div>
    <div class="header-actions">
      <button id="btnSubscribe" class="btn-action">Enable Push</button>
      <button id="btnTestPush" class="btn-action btn-blue">Test Push</button>
    </div>
  </header>

  <nav class="categories-bar" id="categoriesNav">
    <!-- Category Pills Injected Here -->
  </nav>

  <main class="games-grid" id="scoreboardContainer">
    <div class="loading-card">
      Connecting to Live Stream...
    </div>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
