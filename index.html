<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sports Alerts</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.12);
      --glass-border: rgba(255, 255, 255, 0.22);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --accent-neon: #00f0ff;
      --accent-pink: #ff007f;
      --accent-green: #00ff88;
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.65);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #090d16 0%, #111827 50%, #1f082b 100%);
      background-attachment: fixed;
      color: var(--text-main);
      padding: 5rem 1rem 3rem 1rem;
      max-width: 560px;
      margin: 0 auto;
    }

    /* Fixed Navigation Bar with Master Switch */
    nav.navbar {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 560px;
      padding: 0.8rem 1.2rem;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--glass-border);
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-title {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(90deg, #ffffff, var(--accent-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Master Switch Styling */
    .master-switch-container {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .master-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 26px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.2);
      transition: .3s ease;
      border-radius: 34px;
      border: 1px solid var(--glass-border);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s ease;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
    }

    input:checked + .slider:before {
      transform: translateX(22px);
      background-color: #090d16;
    }

    /* Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      margin-top: 0.5rem;
      margin-bottom: 1.5rem;
      box-shadow: var(--glass-shadow);
      -webkit-overflow-scrolling: touch;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    .tab.active {
      background: rgba(255, 255, 255, 0.2);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
    }

    /* Redesigned Game Cards */
    .game-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 1rem 1.25rem;
      margin-bottom: 1rem;
      box-shadow: var(--glass-shadow);
      transition: border-color 0.2s ease;
    }

    .game-card.alert-enabled {
      border-color: var(--accent-neon);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.75rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .status-tag {
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .status-tag.live {
      background: rgba(255, 0, 127, 0.25);
      color: var(--accent-pink);
      border: 1px solid var(--accent-pink);
    }

    .alert-toggle-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--glass-border);
      color: var(--text-muted);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }

    .alert-toggle-btn.active {
      background: rgba(0, 240, 255, 0.2);
      color: var(--accent-neon);
      border-color: var(--accent-neon);
    }

    /* Scoreboard Layout */
    .scoreboard {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .team-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .team-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .team-logo {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .team-name {
      font-size: 15px;
      font-weight: 700;
    }

    .team-record {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 6px;
    }

    .score-display {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: -0.5px;
      color: var(--text-main);
      min-width: 30px;
      text-align: right;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar with Master Push Switch -->
  <nav class="navbar">
    <div class="nav-title">Sports Alerts</div>
    <div class="master-switch-container">
      <span class="master-label" id="master-status-text">OFF</span>
      <label class="switch">
        <input type="checkbox" id="master-push-toggle" onchange="toggleMasterPush(this.checked)">
        <span class="slider"></span>
      </label>
    </div>
  </nav>

  <!-- Category Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('mlb', this)">MLB</button>
    <button class="tab" onclick="switchTab('nba', this)">NBA</button>
    <button class="tab" onclick="switchTab('nfl', this)">NFL</button>
    <button class="tab" onclick="switchTab('nhl', this)">NHL</button>
    <button class="tab" onclick="switchTab('soccer', this)">Soccer</button>
    <button class="tab" onclick="switchTab('mma', this)">MMA</button>
  </div>

  <div id="games-container">Loading scores...</div>

  <script>
    const VAPID_KEY = 'BA8NXZjt4Aj2NsNFZwFQJPvNHoGdz87nVB_0MJCQdbXFMhgOmkWsd-STbCKtgPIBPrWF7-Umqrili8Ef4xS352E';
    const APP_ID = 'd1eje7SvxRjIFsdB6c3TuQLlF8v6zExAMBzChgXa';
    const JS_KEY = 'eQqLLilvkNhy04m0OF5J4ry17vw0FKeeEHfPT2mq';

    const URLS = {
      mlb: 'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard',
      nba: 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard',
      nfl: 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
      nhl: 'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard',
      soccer: 'https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/scoreboard',
      mma: 'https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard'
    };

    const savedGames = JSON.parse(localStorage.getItem('selectedGameIds') || '[]');
    const selectedGameIds = new Set(savedGames);
    let masterEnabled = localStorage.getItem('masterPushEnabled') === 'true';

    // Initialize Master Switch State on UI Load
    document.addEventListener('DOMContentLoaded', () => {
      const masterToggle = document.getElementById('master-push-toggle');
      masterToggle.checked = masterEnabled;
      updateMasterLabel(masterEnabled);
    });

    function updateMasterLabel(enabled) {
      document.getElementById('master-status-text').innerText = enabled ? 'ON' : 'OFF';
      document.getElementById('master-status-text').style.color = enabled ? 'var(--accent-green)' : 'var(--text-muted)';
    }

    async function toggleMasterPush(enable) {
      masterEnabled = enable;
      localStorage.setItem('masterPushEnabled', enable);
      updateMasterLabel(enable);

      if (enable) {
        if (!('serviceWorker' in navigator)) {
          alert('Launch this app from your iPad Home Screen to enable Web Push.');
          revertMasterSwitch(false);
          return;
        }

        const perm = await Notification.requestPermission();
        if (perm !== 'granted') {
          alert('Notification permission denied.');
          revertMasterSwitch(false);
          return;
        }

        await syncSubscriptionWithServer();
      } else {
        await syncSubscriptionWithServer();
      }
    }

    function revertMasterSwitch(state) {
      masterEnabled = state;
      localStorage.setItem('masterPushEnabled', state);
      document.getElementById('master-push-toggle').checked = state;
      updateMasterLabel(state);
    }

    function toggleGameAlert(gameId, cardEl) {
      if (selectedGameIds.has(String(gameId))) {
        selectedGameIds.delete(String(gameId));
        cardEl.classList.remove('alert-enabled');
      } else {
        selectedGameIds.add(String(gameId));
        cardEl.classList.add('alert-enabled');
      }
      
      localStorage.setItem('selectedGameIds', JSON.stringify(Array.from(selectedGameIds)));
      
      // Update active card button UI
      const btn = cardEl.querySelector('.alert-toggle-btn');
      const isSubbed = selectedGameIds.has(String(gameId));
      btn.className = `alert-toggle-btn ${isSubbed ? 'active' : ''}`;
      btn.innerText = isSubbed ? 'Alert On' : 'Alert Off';

      if (masterEnabled) {
        syncSubscriptionWithServer();
      }
    }

    async function syncSubscriptionWithServer() {
      try {
        const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
        await navigator.serviceWorker.ready;

        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_KEY)
        });

        await fetch('https://parseapi.back4app.com/parse/functions/saveSubscription', {
          method: 'POST',
          headers: {
            'X-Parse-Application-Id': APP_ID,
            'X-Parse-JavaScript-Key': JS_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            subscription: masterEnabled ? sub.toJSON() : null,
            gameIds: masterEnabled ? Array.from(selectedGameIds) : []
          })
        });
      } catch (e) {
        console.error('Subscription Sync Error:', e);
      }
    }

    function switchTab(cat, btn) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      loadSchedule(cat);
    }

    async function loadSchedule(cat) {
      const container = document.getElementById('games-container');
      container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 2rem;">Loading live scores...</p>';
      
      try {
        const res = await fetch(URLS[cat]);
        const data = await res.json();
        
        if (!data.events || data.events.length === 0) {
          container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 2rem;">No games scheduled today.</p>';
          return;
        }

        container.innerHTML = '';
        data.events.forEach(e => {
          const comp = e.competitions[0];
          const comps = comp.competitors || [];
          const id = String(e.id);
          const isLive = e.status.type.state === 'in';
          
          let home = comps.find(c => c.homeAway === 'home') || comps[0];
          let away = comps.find(c => c.homeAway === 'away') || comps[1];

          const homeName = home?.team?.shortDisplayName || home?.athlete?.displayName || 'HOME';
          const homeLogo = home?.team?.logo || 'https://a.espncdn.com/i/espn/espn_logos/espn_red.png';
          const homeRecord = home?.records?.[0]?.summary || '';
          const homeScore = home?.score ?? '0';

          const awayName = away?.team?.shortDisplayName || away?.athlete?.displayName || 'AWAY';
          const awayLogo = away?.team?.logo || 'https://a.espncdn.com/i/espn/espn_logos/espn_red.png';
          const awayRecord = away?.records?.[0]?.summary || '';
          const awayScore = away?.score ?? '0';

          const isSubscribed = selectedGameIds.has(id);
          const card = document.createElement('div');
          card.className = `game-card ${isSubscribed ? 'alert-enabled' : ''}`;
          
          card.innerHTML = `
            <div class="card-top">
              <span class="status-tag ${isLive ? 'live' : ''}">${e.status.type.detail}</span>
              <button class="alert-toggle-btn ${isSubscribed ? 'active' : ''}" onclick="toggleGameAlert('${id}', this.closest('.game-card'))">
                ${isSubscribed ? '🔔 Alert On' : '🔕 Alert Off'}
              </button>
            </div>
            
            <div class="scoreboard">
              <div class="team-row">
                <div class="team-info">
                  <img class="team-logo" src="${awayLogo}" alt="${awayName}" onerror="this.src='https://a.espncdn.com/i/espn/espn_logos/espn_red.png'">
                  <div>
                    <span class="team-name">${awayName}</span>
                    <span class="team-record">${awayRecord}</span>
                  </div>
                </div>
                <div class="score-display">${awayScore}</div>
              </div>

              <div class="team-row">
                <div class="team-info">
                  <img class="team-logo" src="${homeLogo}" alt="${homeName}" onerror="this.src='https://a.espncdn.com/i/espn/espn_logos/espn_red.png'">
                  <div>
                    <span class="team-name">${homeName}</span>
                    <span class="team-record">${homeRecord}</span>
                  </div>
                </div>
                <div class="score-display">${homeScore}</div>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = '<p style="text-align:center; color: var(--accent-pink); padding: 2rem;">Failed to fetch scores.</p>';
      }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    loadSchedule('mlb');
  </script>
</body>
</html>
