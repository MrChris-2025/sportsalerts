<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sports Alerts</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.15);
      --glass-border: rgba(255, 255, 255, 0.25);
      --glass-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      --accent-blue: #00f0ff;
      --accent-pink: #ff007f;
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.7);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      background-attachment: fixed;
      color: var(--text-main);
      padding: 1.5rem 1rem 4rem 1rem;
      max-width: 560px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    header h1 {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(180deg, #ffffff 0%, var(--text-muted) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Glass Navigation Bar */
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 6px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      margin-bottom: 1.5rem;
      box-shadow: var(--glass-shadow);
      -webkit-overflow-scrolling: touch;
    }

    .tabs::-webkit-scrollbar { display: none; }

    .tab {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.3s ease;
    }

    .tab.active {
      background: rgba(255, 255, 255, 0.25);
      color: var(--text-main);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
    }

    /* Glass Game Cards */
    .game-card {
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 1.25rem;
      margin-bottom: 1rem;
      box-shadow: var(--glass-shadow);
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .game-card.selected {
      border-color: var(--accent-blue);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 0.5rem;
    }

    .venue-info {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .status-badge.live {
      background: rgba(255, 0, 127, 0.2);
      color: var(--accent-pink);
      border: 1px solid var(--accent-pink);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }

    .matchup-container {
      display: grid;
      grid-template-columns: 1fr auto 1fr auto;
      align-items: center;
      gap: 12px;
    }

    .team {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .team-logo {
      width: 36px;
      height: 36px;
      object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
    }

    .team-details {
      display: flex;
      flex-direction: column;
    }

    .team-name {
      font-size: 15px;
      font-weight: 700;
    }

    .team-record {
      font-size: 11px;
      color: var(--text-muted);
    }

    .team-score {
      font-size: 20px;
      font-weight: 800;
      color: var(--text-main);
      padding: 0 6px;
    }

    /* Checkbox Styling */
    .toggle-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      padding-left: 8px;
    }

    .toggle-wrapper input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 26px;
      height: 26px;
      border: 2px solid var(--glass-border);
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.2);
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
    }

    .toggle-wrapper input[type="checkbox"]:checked {
      background: var(--accent-blue);
      border-color: var(--accent-blue);
      box-shadow: 0 0 12px var(--accent-blue);
    }

    .toggle-wrapper input[type="checkbox"]:checked::after {
      content: '✓';
      position: absolute;
      color: #0f172a;
      font-weight: 900;
      font-size: 16px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Glass Action Button */
    button.submit-btn {
      width: 100%;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.4) 0%, rgba(255, 0, 127, 0.4) 100%);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      padding: 18px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 16px;
      cursor: pointer;
      box-shadow: var(--glass-shadow);
      margin-top: 1.5rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button.submit-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <header>
    <h1>Sports Alerts</h1>
    <p>Live scoreboard & instant push notifications</p>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('mlb', this)">MLB</button>
    <button class="tab" onclick="switchTab('nba', this)">NBA</button>
    <button class="tab" onclick="switchTab('nfl', this)">NFL</button>
    <button class="tab" onclick="switchTab('nhl', this)">NHL</button>
    <button class="tab" onclick="switchTab('soccer', this)">Soccer</button>
    <button class="tab" onclick="switchTab('mma', this)">MMA</button>
  </div>

  <div id="games-container">Loading scores...</div>

  <button class="submit-btn" id="sub-btn">Enable Push & Save Preferences</button>

  <script>
    const VAPID_KEY = 'BA8NXZjt4Aj2NsNFZwFQJPvNHoGdz87nVB_0MJCQdbXFMhgOmkWsd-STbCKtgPIBPrWF7-Umqrili8Ef4xS352E';
    const APP_ID = 'd1eje7SvxRjIFsdB6c3TuQLlF8v6zExAMBzChgXa';
    const JS_KEY = 'eQqLLilvkNhy04m0OF5J4ry17vw0FKeeEHfPT2mq';

    const URLS = {
      mlb: 'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard',
      nba: 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard',
      nfl: 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
      nhl: 'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard',
      soccer: 'https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/scoreboard',
      mma: 'https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard'
    };

    const saved = JSON.parse(localStorage.getItem('selectedGameIds') || '[]');
    const selectedGameIds = new Set(saved);

    function switchTab(cat, btn) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      loadSchedule(cat);
    }

    function toggleGame(id, checked, cardEl) {
      if (checked) {
        selectedGameIds.add(String(id));
        cardEl.classList.add('selected');
      } else {
        selectedGameIds.delete(String(id));
        cardEl.classList.remove('selected');
      }
      localStorage.setItem('selectedGameIds', JSON.stringify(Array.from(selectedGameIds)));
    }

    async function loadSchedule(cat) {
      const container = document.getElementById('games-container');
      container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 2rem;">Loading live scores...</p>';
      
      try {
        const res = await fetch(URLS[cat]);
        const data = await res.json();
        
        if (!data.events || data.events.length === 0) {
          container.innerHTML = '<p style="text-align:center; color: var(--text-muted); padding: 2rem;">No games scheduled today.</p>';
          return;
        }

        container.innerHTML = '';
        data.events.forEach(e => {
          const comp = e.competitions[0];
          const comps = comp.competitors || [];
          const id = String(e.id);
          const isLive = e.status.type.state === 'in';
          const venue = comp.venue?.fullName || 'Stadium';
          
          let home = comps.find(c => c.homeAway === 'home') || comps[0];
          let away = comps.find(c => c.homeAway === 'away') || comps[1];

          const homeName = home?.team?.abbreviation || home?.athlete?.displayName || 'HOME';
          const homeLogo = home?.team?.logo || 'https://a.espncdn.com/i/espn/espn_logos/espn_red.png';
          const homeRecord = home?.records?.[0]?.summary || '';
          const homeScore = home?.score ?? '-';

          const awayName = away?.team?.abbreviation || away?.athlete?.displayName || 'AWAY';
          const awayLogo = away?.team?.logo || 'https://a.espncdn.com/i/espn/espn_logos/espn_red.png';
          const awayRecord = away?.records?.[0]?.summary || '';
          const awayScore = away?.score ?? '-';

          const checked = selectedGameIds.has(id);
          const card = document.createElement('div');
          card.className = `game-card ${checked ? 'selected' : ''}`;
          
          card.innerHTML = `
            <div class="card-header">
              <span class="venue-info">${venue}</span>
              <span class="status-badge ${isLive ? 'live' : ''}">${e.status.type.detail}</span>
            </div>
            <div class="matchup-container">
              <div class="team">
                <img class="team-logo" src="${awayLogo}" alt="${awayName}" onerror="this.src='https://a.espncdn.com/i/espn/espn_logos/espn_red.png'">
                <div class="team-details">
                  <span class="team-name">${awayName}</span>
                  <span class="team-record">${awayRecord}</span>
                </div>
              </div>
              <div class="team-score">${awayScore}</div>
              
              <div class="team">
                <img class="team-logo" src="${homeLogo}" alt="${homeName}" onerror="this.src='https://a.espncdn.com/i/espn/espn_logos/espn_red.png'">
                <div class="team-details">
                  <span class="team-name">${homeName}</span>
                  <span class="team-record">${homeRecord}</span>
                </div>
              </div>
              <div class="team-score">${homeScore}</div>

              <div class="toggle-wrapper">
                <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleGame('${id}', this.checked, this.closest('.game-card'))">
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = '<p style="text-align:center; color: var(--accent-pink); padding: 2rem;">Failed to fetch live schedule.</p>';
      }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    document.getElementById('sub-btn').addEventListener('click', async () => {
      if (!('serviceWorker' in navigator)) {
        alert('Please launch this app from your iPad Home Screen.');
        return;
      }

      const perm = await Notification.requestPermission();
      if (perm !== 'granted') {
        alert('Permission denied.');
        return;
      }

      try {
        const reg = await navigator.serviceWorker.register('/sw.js', { scope: '/' });
        await navigator.serviceWorker.ready;

        const sub = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_KEY)
        });

        const res = await fetch('https://parseapi.back4app.com/parse/functions/saveSubscription', {
          method: 'POST',
          headers: {
            'X-Parse-Application-Id': APP_ID,
            'X-Parse-JavaScript-Key': JS_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            subscription: sub.toJSON(),
            gameIds: Array.from(selectedGameIds)
          })
        });

        if (res.ok) {
          alert('Preferences & Web Push successfully saved!');
        } else {
          alert('Saved locally, but failed to reach server.');
        }
      } catch (e) {
        alert('Error: ' + e.message);
      }
    });

    loadSchedule('mlb');
  </script>
</body>
</html>
