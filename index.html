<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESPN ScoreCenter</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
</head>
<body>
  <header class="top-nav glass">
    <div class="brand">
      <span class="espn-red">ESPN</span>
      <span class="brand-sub">ALERT HUB</span>
    </div>
    <div class="nav-center">
      <input type="date" id="gameDatePicker" class="glass-input" onchange="onDateOrLeagueChange()">
    </div>
    <div class="clock-display" id="clock">12:00 PM ET</div>
  </header>

  <div class="app-layout">
    <aside class="sidebar glass">
      <div class="sidebar-title">LEAGUES</div>
      <nav class="league-menu">
        <button class="league-btn" data-sport="basketball" data-league="nba" onclick="selectLeague(this)">NBA</button>
        <button class="league-btn" data-sport="basketball" data-league="mens-college-basketball" onclick="selectLeague(this)">NCAAB</button>
        <button class="league-btn" data-sport="football" data-league="nfl" onclick="selectLeague(this)">NFL</button>
        <button class="league-btn" data-sport="football" data-league="college-football" onclick="selectLeague(this)">NCAAF</button>
        <button class="league-btn active" data-sport="baseball" data-league="mlb" onclick="selectLeague(this)">MLB</button>
        <button class="league-btn" data-sport="hockey" data-league="nhl" onclick="selectLeague(this)">NHL</button>
        <button class="league-btn" data-sport="soccer" data-league="eng.1" onclick="selectLeague(this)">EPL</button>
        <button class="league-btn" data-sport="soccer" data-league="usa.1" onclick="selectLeague(this)">MLS</button>
        <button class="league-btn" data-sport="soccer" data-league="uefa.champions" onclick="selectLeague(this)">UCL</button>
      </nav>
    </aside>

    <main class="main-content">
      <div id="scoreboard" class="grid"></div>
    </main>
  </div>
<button onclick="setDiscordWebhook()">Set Discord Webhook</button>

  <script src="app.js"></script>
</body>
</html>
