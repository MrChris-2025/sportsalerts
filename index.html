<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Sports Tracker</title>
  <link rel="manifest" href="./manifest.json">
  <script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
  <style>
    body { background-color: #0f172a; color: #fff; font-family: system-ui, sans-serif; padding: 20px; margin: 0; }
    .card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 16px; margin-bottom: 12px; backdrop-filter: blur(10px); }
    .header { display: flex; justify-content: space-between; align-items: center; }
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .3s; border-radius: 24px; }
    .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #3b82f6; }
    input:checked + .slider:before { transform: translateX(20px); }
  </style>
</head>
<body>
  <div class="card header">
    <h2>Main PWA Push Alerts</h2>
    <label class="switch">
      <input type="checkbox" id="main-push-toggle">
      <span class="slider"></span>
    </label>
  </div>
  <h3>Live Matches</h3>
  <div id="games-container"></div>
  <script type="module" src="./index.js"></script>
</body>
</html>
