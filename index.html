<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sports Scores - ESPN Style</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='-.1em' font-size='100'>⚽</text></svg>">
</head>
<body>
    <header>
        <div class="logo">SPORTS LIVE</div>
        <nav>
            <ul>
                <li><a href="#">Scores</a></li>
                <li><a href="#">News</a></li>
                <li><a href="#">My Teams</a></li>
            </ul>
        </nav>
    </header>

    <main id="app">
        <h1>Live Scores</h1>
        <div id="scores-container" class="scores-container">
            <!-- Live score cards will be injected here by index.js -->
            <div class="loading-message">Loading live scores...</div>
        </div>
        <button id="subscribeButton" class="subscribe-button">Enable Push Notifications</button>
    </main>

    <footer>
        &copy; 2026 Sports Live. All rights reserved.
    </footer>

    <script type="module" src="index.js"></script>
</body>
</html>
