<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ESPN Multi-Sport Live Alerts</title>

  <!-- PWA Headers -->
  <link rel="manifest" href="./manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SportsAlerts">
  <link rel="apple-touch-icon" href="https://a.espncdn.com/i/espn/espn_logos/espn_red.png">
  <meta name="theme-color" content="#007aff">

  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      max-width: 520px;
      margin: 0 auto;
      padding: 1.5rem 1rem 3rem 1rem;
      background-color: #f4f4f9;
      color: #1c1c1e;
    }
    h2 { text-align: center; margin: 0 0 0.2rem 0; font-size: 24px; font-weight: 700; }
    p.subtitle { text-align: center; color: #6c6c70; font-size: 14px; margin: 0 0 1.5rem 0; }
    
    /* Category Filter Tabs */
    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 1.2rem;
      -webkit-overflow-scrolling: touch;
    }
    .tab {
      background: #e5e5ea;
      color: #1c1c1e;
      border: none;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }
    .tab.active {
      background: #007aff;
      color: white;
    }

    .game-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 1.2rem 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }
    .game-info { font-weight: 600; font-size: 15px; margin-bottom: 4px; }
    .game-status { font-size: 12px; color: #8e8e93; }
    input[type="checkbox"] {
      width: 24px;
      height: 24px;
      accent-color: #007aff;
      border-radius: 6px;
      cursor: pointer;
    }
    button.submit-btn {
      width: 100%;
      background-color: #007aff;
      color: white;
      border: none;
      padding: 16px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 1.5rem;
      box-shadow: 0 4px 12px rgba(0, 122, 255, 0.25);
    }
    button.submit-btn:active { opacity: 0.85; transform: scale(0.99); }
  </style>
</head>
<body>

  <h2>Live Sports & Games</h2>
  <p class="subtitle">Select matches across leagues to get iPad push alerts</p>

  <!-- Category Nav Tabs -->
  <div class="tabs">
    <button class="tab active" onclick="switchCategory('mlb', this)">MLB</button>
    <button class="tab" onclick="switchCategory('nba', this)">NBA</button>
    <button class="tab" onclick="switchCategory('nfl', this)">NFL</button>
    <button class="tab" onclick="switchCategory('nhl', this)">NHL</button>
    <button class="tab" onclick="switchCategory('soccer', this)">Soccer</button>
    <button class="tab" onclick="switchCategory('mma', this)">MMA</button>
  </div>

  <div id="games-container">Loading ESPN schedule...</div>

  <button class="submit-btn" id="subscribe-btn">Save Preferences & Enable Push</button>

  <script>
    const VAPID_PUBLIC_KEY = 'BA8NXZjt4Aj2NsNFZwFQJPvNHoGdz87nVB_0MJCQdbXFMhgOmkWsd-STbCKtgPIBPrWF7-Umqrili8Ef4xS352E';
    const PARSE_APP_ID = 'd1eje7SvxRjIFsdB6c3TuQLlF8v6zExAMBzChgXa';
    const PARSE_JS_KEY = 'eQqLLilvkNhy04m0OF5J4ry17vw0FKeeEHfPT2mq';

    const CATEGORY_URLS = {
      mlb: 'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard',
      nba: 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard',
      nfl: 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard',
      nhl: 'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard',
      soccer: 'https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/scoreboard',
      mma: 'https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard'
    };

    let currentCategory = 'mlb';

    function switchCategory(category, element) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      element.classList.add('active');
      currentCategory = category;
      loadSchedule(category);
    }

    async function loadSchedule(category) {
      const container = document.getElementById('games-container');
      container.innerHTML = '<p style="text-align:center; color:#8e8e93;">Loading schedule...</p>';

      try {
        const res = await fetch(CATEGORY_URLS[category]);
        const data = await res.json();
        
        if (!data.events || data.events.length === 0) {
          container.innerHTML = '<p style="text-align:center; color:#8e8e93;">No matches scheduled today.</p>';
          return;
        }

        container.innerHTML = '';
        data.events.forEach(event => {
          const comp = event.competitions[0];
          const competitors = comp.competitors || [];
          
          let titleText = event.name;
          if (competitors.length >= 2) {
            const home = competitors.find(c => c.homeAway === 'home')?.team?.displayName || competitors[0].athlete?.displayName || 'Home';
            const away = competitors.find(c => c.homeAway === 'away')?.team?.displayName || competitors[1].athlete?.displayName || 'Away';
            titleText = `${away} @ ${home}`;
          }

          const status = event.status.type.detail;

          const card = document.createElement('div');
          card.className = 'game-card';
          card.innerHTML = `
            <div>
              <div class="game-info">${titleText}</div>
              <div class="game-status">${status}</div>
            </div>
            <input type="checkbox" class="game-checkbox" value="${event.id}">
          `;
          container.appendChild(card);
        });
      } catch (err) {
        container.innerHTML = '<p style="text-align:center; color:#ff3b30;">Failed to fetch schedule from ESPN.</p>';
      }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    document.getElementById('subscribe-btn').addEventListener('click', async () => {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
        alert('Launch this app from your iPad Home Screen to enable push alerts.');
        return;
      }

      const selectedGames = Array.from(document.querySelectorAll('.game-checkbox:checked')).map(cb => cb.value);

      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        alert('Notification permission was denied.');
        return;
      }

      try {
        const reg = await navigator.serviceWorker.register('./sw.js');
        const subscription = await reg.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });

        const res = await fetch('https://parseapi.back4app.com/functions/saveSubscription', {
          method: 'POST',
          headers: {
            'X-Parse-Application-Id': PARSE_APP_ID,
            'X-Parse-JavaScript-Key': PARSE_JS_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ 
            subscription: subscription.toJSON(),
            gameIds: selectedGames 
          })
        });

        if (res.ok) {
          alert('Success! Device registered for selected score alerts.');
        } else {
          alert('Failed to save choices to Back4App.');
        }
      } catch (err) {
        alert('Error enabling notifications: ' + err.message);
      }
    });

    loadSchedule('mlb');
  </script>
</body>
</html>
